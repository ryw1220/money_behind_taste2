<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Behind Taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <link href="./company-explorer-integration.css?v=rc3.2-precompiled" rel="stylesheet">
  <style>
  :root {
    --font-sans: "Pretendard Variable", "Pretendard", system-ui, sans-serif;
    --font-serif: "Fraunces", serif;
  }
:root {
  /* Brand override — editorial palette per PRD */
  --mbt-brick: #B5321A;
  --mbt-brick-dark: #8B1A0A;
  --mbt-brick-soft: #F5E6E0;
  --mbt-green: #1A6B5A;
  --mbt-green-soft: #E3EFEB;
  --mbt-gold: #B89249;
  --mbt-ink: #111111;
  --mbt-ink-2: #2A2A28;
  --mbt-paper: #F8F7F5;
  --mbt-paper-2: #F1EFEA;
  --mbt-line: #E5E2DA;
  --mbt-line-2: #D9D5CB;
  --mbt-gray-1: #6B6B68;
  --mbt-gray-2: #9A988F;

  /* Industry colors */
  --ind-food: #B5321A;
  --ind-fashion: #1A1A1A;
  --ind-beauty: #7A2541;
  --ind-living: #2C5F4A;
  --ind-content: #DC6B2F;
  --ind-media: #2D3E68;
  --ind-pub: #5A3825;
  --ind-edu: #4A6FA5;
  --ind-commerce: #C97A3F;
  --ind-leisure: #2E8B7A;
  --ind-tech: #2D2D8C;
  --ind-mobility: #3A3A3A;

  --font-serif: "Fraunces", "Pretendard", serif;
  --font-num: "Pretendard", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background: var(--mbt-paper);
  color: var(--mbt-ink);
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
a { color: inherit; text-decoration: none; }

.tnum { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.02em; }
.mono-eyebrow {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mbt-gray-1);
}

/* ───── Top Nav ───── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248, 247, 245, 0.92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--mbt-line);
}
.topnav-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.brand-mark {
  display: flex;
  align-items: baseline;
  gap: 10px;
  cursor: pointer;
}
.brand-mark .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--mbt-brick);
  display: inline-block;
  transform: translateY(-1px);
}
.brand-mark .name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.brand-mark .ko {
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: -0.02em;
}
.nav-links {
  display: flex;
  gap: 28px;
  margin-left: 24px;
  flex: 1;
}
.nav-links button {
  font-size: 14px;
  font-weight: 500;
  color: var(--mbt-ink-2);
  letter-spacing: -0.01em;
  position: relative;
  padding: 4px 0;
}
.nav-links button.active { color: var(--mbt-brick); }
.nav-links button.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
  height: 2px; background: var(--mbt-brick);
}
.nav-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--mbt-paper-2);
  border: 1px solid var(--mbt-line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 13px;
  color: var(--mbt-gray-1);
  min-width: 220px;
}
.nav-search input {
  border: none; background: transparent; outline: none;
  font-family: inherit; font-size: 13px; color: var(--mbt-ink);
  flex: 1;
}

/* ───── Page container ───── */
.page {
  max-width: 1320px;
  margin: 0 auto;
  padding: 56px 32px 96px;
}

/* ───── Hero (Home) ───── */
.hero-eyebrow {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.hero-eyebrow .rule { flex: 0 0 60px; height: 1px; background: var(--mbt-ink); }
.hero-title {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: clamp(41px, 5.1vw, 71px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 0 0 28px;
  max-width: 1100px;
}
.hero-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--mbt-brick);
}
.hero-sub {
  font-size: 15px;
  line-height: 1.65;
  color: var(--mbt-ink-2);
  max-width: 640px;
  margin: 0 0 36px;
  letter-spacing: -0.01em;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  padding: 28px 0;
  margin-bottom: 64px;
}
.hero-stats-compact {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  padding: 20px 0 20px;
  margin-bottom: 40px;
}
.hero-stat-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 20px;
  border-right: 1px solid var(--mbt-line);
}
.hero-stat-row:last-of-type {
  border-right: none;
}
.hero-stat-row .s-num {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
}
.hero-stat-row .s-num .u {
  font-size: 14px;
  color: var(--mbt-gray-1);
  margin-left: 3px;
}
.hero-stat-row .s-desc {
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: -0.01em;
  line-height: 1.4;
}
.hero-dart-note {
  font-size: 11px;
  color: var(--mbt-gray-2);
  margin: 8px 0 0;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.hero-stat { padding-right: 24px; padding-bottom: 20px; border-right: 1px solid var(--mbt-line); border-bottom: 1px solid var(--mbt-line); }
.hero-stat:last-child { border-right: none; }
.hero-stat .num {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 31px;
  line-height: 1;
  letter-spacing: -0.025em;
  margin-bottom: 6px;
}
.hero-stat .num .unit { font-size: 13px; color: var(--mbt-gray-1); margin-left: 3px; font-weight: 400; }
.hero-stat .lbl { font-size: 13px; color: var(--mbt-gray-1); letter-spacing: -0.01em; }

/* ───── Section header ───── */
.section-head {
  display: flex; align-items: end; justify-content: space-between;
  margin: 64px 0 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--mbt-ink);
}
.section-head h2 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 36px;
  margin: 8px 0 0;
  letter-spacing: -0.025em;
  line-height: 1;
}
.section-head .meta { font-size: 13px; color: var(--mbt-gray-1); }

/* ───── Industry cards ───── */
.industry-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--mbt-line);
  border: 1px solid var(--mbt-line);
}
.ind-card {
  background: var(--mbt-paper);
  padding: 18px 22px 16px;
  cursor: pointer;
  transition: background 160ms ease;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 190px;
}
.ind-card:hover { background: #fff; }
.ind-card .head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.ind-card .num-badge {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: 0.05em;
}
.ind-card .stripe {
  width: 28px; height: 3px; background: var(--c); border-radius: 2px;
}
.ind-card .name {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.ind-card .rev {
  font-size: 13px; color: var(--mbt-gray-1);
}
.ind-card .rev .b {
  font-family: var(--font-serif); font-size: 18px; font-weight: 500; color: var(--mbt-ink); margin-right: 4px;
}
.ind-card .top3 {
  font-size: 12px; color: var(--mbt-ink-2); display: flex; flex-direction: column; gap: 3px;
  border-top: 1px dashed var(--mbt-line);
  padding-top: 12px;
  margin-top: auto;
}
.ind-card .top3 li { display: flex; justify-content: space-between; }
.ind-card .top3 li span:last-child { color: var(--mbt-gray-1); font-variant-numeric: tabular-nums; }
.ind-card ul { list-style: none; padding: 0; margin: 0; }


/* ───── Editorial features ───── */
.features {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 24px;
}
.feature {
  cursor: pointer;
  border-top: 2px solid var(--mbt-ink);
  padding-top: 20px;
  display: flex; flex-direction: column;
  min-height: 320px;
}
.feature.hero {
  grid-row: span 2;
  border-top: 4px solid var(--mbt-brick);
}
.feature .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mbt-brick); font-weight: 600; margin-bottom: 14px; }
.feature h3 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.025em;
  line-height: 1.15;
  margin: 0 0 14px;
}
.feature.hero h3 { font-size: 32px; line-height: 1.1; }
.feature p { font-size: 14px; color: var(--mbt-ink-2); line-height: 1.65; margin: 0 0 18px; }
.feature .read { margin-top: auto; font-size: 13px; color: var(--mbt-brick); font-weight: 500; }
.feature .stat-inline {
  font-family: var(--font-serif);
  font-size: 56px;
  letter-spacing: -0.03em;
  color: var(--mbt-brick);
  line-height: 1;
  margin: 8px 0 16px;
}
.feature .stat-inline .small { font-size: 18px; color: var(--mbt-gray-1); }
.feature .visual {
  height: 140px;
  background: var(--mbt-paper-2);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

/* ───── Bubble map ───── */
.bubble-wrap {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 32px 28px;
  position: relative;
}
.bubble-wrap h3 {
  font-family: var(--font-serif);
  font-size: 24px; margin: 0 0 6px; font-weight: 500; letter-spacing: -0.02em;
}
.bubble-wrap .desc { font-size: 13px; color: var(--mbt-gray-1); margin-bottom: 18px; }

/* ───── Industry View ───── */
.ind-hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
  border-bottom: 1px solid var(--mbt-ink);
  padding-bottom: 36px;
  margin-bottom: 32px;
}
.ind-hero .label { font-size: 13px; color: var(--c); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 18px; }
.ind-hero h1 {
  font-family: var(--font-serif);
  font-size: 72px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 0.95;
  margin: 0 0 20px;
}
.ind-hero .sum { font-size: 17px; color: var(--mbt-ink-2); line-height: 1.65; }
.ind-hero .stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
  border-top: 1px solid var(--mbt-line);
}
.ind-hero .stats .s {
  border-bottom: 1px solid var(--mbt-line);
  border-right: 1px solid var(--mbt-line);
  padding: 20px 16px;
}
.ind-hero .stats .s:nth-child(3n) { border-right: none; }
.ind-hero .stats .num { font-family: var(--font-serif); font-size: 36px; letter-spacing: -0.025em; font-weight: 500; line-height: 1; }
.ind-hero .stats .num .u { font-size: 14px; color: var(--mbt-gray-1); margin-left: 4px; }
.ind-hero .stats .lbl { font-size: 12px; color: var(--mbt-gray-1); margin-top: 6px; }

/* Industry dashboard layout */
.dash-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}
.dash-card {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 28px 26px;
}
.dash-card h3 {
  font-family: var(--font-serif);
  font-size: 22px; font-weight: 500; letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.dash-card .sub { font-size: 12px; color: var(--mbt-gray-1); margin-bottom: 22px; }

/* Insight box (editorial) */
.insight-box {
  border-left: 3px solid var(--mbt-brick);
  padding: 4px 18px;
  margin: 18px 0;
}
.insight-box .label { font-size: 10px; letter-spacing: 0.2em; color: var(--mbt-brick); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
.insight-box p { font-family: var(--font-serif); font-size: 17px; line-height: 1.5; margin: 0; letter-spacing: -0.01em; color: var(--mbt-ink); }

/* Company list table */
.co-table {
  background: #fff;
  border: 1px solid var(--mbt-line);
  width: 100%;
}
.co-table .row {
  display: grid;
  grid-template-columns: 36px 2fr 1fr 1fr 1fr 1fr 80px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--mbt-line);
  font-size: 13px;
  cursor: pointer;
  transition: background 120ms;
}
.co-table .row:last-child { border-bottom: none; }
.co-table .row:hover { background: var(--mbt-paper-2); }
.co-table .row.head {
  background: var(--mbt-paper-2);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--mbt-gray-1); font-weight: 600;
  cursor: default;
}
.co-table .row.head:hover { background: var(--mbt-paper-2); }
.co-table .rank { font-family: var(--font-serif); color: var(--mbt-gray-1); }
.co-table .name { font-weight: 600; color: var(--mbt-ink); }
.co-table .num { font-variant-numeric: tabular-nums; }
.co-table .pos { color: var(--mbt-green); font-weight: 600; }
.co-table .neg { color: var(--mbt-brick); font-weight: 600; }
.co-table .arrow { color: var(--mbt-gray-2); text-align: right; }
@media (max-width: 640px) {
  .co-table .row {
    grid-template-columns: 30px 1fr auto 24px;
    padding: 12px 14px;
    gap: 0 8px;
  }
  .co-table .row .col-margin,
  .co-table .row .col-growth,
  .co-table .row .col-emp { display: none; }
  .co-table .row.head .col-margin,
  .co-table .row.head .col-growth,
  .co-table .row.head .col-emp { display: none; }
  .co-table .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* Revenue chart + table responsive grid */
.rev-chart-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 20px;
  align-items: start;
  margin-bottom: 24px;
}
@media (max-width: 640px) {
  .rev-chart-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .ind-hero { grid-template-columns: 1fr; gap: 24px; }
  .dash-grid { grid-template-columns: 1fr; }
  .ind-hero h1 { font-size: 48px; }
}

/* ───── Company detail ───── */
.co-hero {
  border-bottom: 1px solid var(--mbt-ink);
  padding-bottom: 36px;
  margin-bottom: 36px;
}
.co-breadcrumb {
  display: flex; gap: 8px; align-items: center;
  font-size: 12px; color: var(--mbt-gray-1);
  margin-bottom: 24px;
}
.co-breadcrumb .crumb { cursor: pointer; }
.co-breadcrumb .crumb:hover { color: var(--mbt-brick); }
.co-breadcrumb .sep { color: var(--mbt-line-2); }
.co-meta {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 18px;
}
.co-tag {
  font-size: 11px; padding: 4px 10px; border: 1px solid var(--c, var(--mbt-line)); color: var(--c, var(--mbt-ink-2));
  border-radius: 999px; letter-spacing: 0.04em; font-weight: 500;
}
.co-tag.solid {
  background: var(--c); color: #fff; border-color: var(--c);
}
.co-tag.listed { color: var(--mbt-green); border-color: var(--mbt-green); }
.co-tag.unlisted { color: var(--mbt-gray-1); border-color: var(--mbt-line-2); }
.co-name {
  font-family: var(--font-serif);
  font-size: clamp(56px, 6.5vw, 92px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 0.95;
  margin: 0 0 18px;
}
.co-desc {
  font-size: 17px; color: var(--mbt-ink-2); line-height: 1.65; max-width: 720px;
  margin: 0 0 28px;
}
.co-info-row {
  display: flex; gap: 32px; flex-wrap: wrap;
  font-size: 13px; color: var(--mbt-gray-1);
}
.co-info-row .item .l { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.co-info-row .item .v { color: var(--mbt-ink); font-weight: 500; }

/* KPI block */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0;
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  margin-bottom: 48px;
}
@media (max-width: 640px) {
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.kpi {
  padding: 20px 12px 18px 16px;
  border-right: 1px solid var(--mbt-line);
}
.kpi:first-child { padding-left: 0; }
.kpi:last-child { border-right: none; }
.kpi .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mbt-gray-1); margin-bottom: 14px; }
.kpi .val {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi .val .u { font-size: 16px; color: var(--mbt-gray-1); margin-left: 3px; font-weight: 400; }
.kpi .delta {
  margin-top: 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.kpi .delta.pos { color: var(--mbt-green); }
.kpi .delta.neg { color: var(--mbt-brick); }
.kpi .delta .arrow { display: inline-block; margin-right: 4px; }

/* Charts */
.chart-card {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 32px 32px 28px;
  margin-bottom: 24px;
}
.chart-card .head {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--mbt-line);
}
.chart-card .head .left { display: flex; flex-direction: column; gap: 6px; }
.chart-card .head .eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mbt-gray-1); font-weight: 600; }
.chart-card .head h3 {
  font-family: var(--font-serif);
  font-size: 28px; font-weight: 500; letter-spacing: -0.025em;
  margin: 0;
}
.chart-card .legend { display: flex; gap: 20px; font-size: 12px; color: var(--mbt-gray-1); }
.chart-card .legend .item { display: flex; align-items: center; gap: 6px; }
.chart-card .legend .sw { width: 14px; height: 8px; border-radius: 2px; }

/* Two-up grid */
.two-up { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-bottom: 24px; }
@media (max-width: 640px) {
  .two-up { grid-template-columns: 1fr; }
  .chart-card { padding: 22px 18px 20px; }
  .chart-card .head h3 { font-size: 22px; }
}

/* Brand cards */
.brand-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--mbt-line);
  border: 1px solid var(--mbt-line);
}
.brand-card {
  background: #fff;
  padding: 22px 20px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 130px;
  cursor: pointer;
  transition: background 120ms;
}

/* Investment points */
.invest-points { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.invest-col h4 {

.invest-col.pos h4 .badge { background: var(--mbt-green); }
.invest-col.neg h4 .badge { background: var(--mbt-brick); }
.invest-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.invest-col li {

}
.invest-col li .h { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.invest-col li .d { font-size: 13px; color: var(--mbt-gray-1); line-height: 1.5; }

/* ───── Story Mode ───── */
html.story-snap { scroll-snap-type: y mandatory; }
.story-stage {
  background: var(--mbt-paper);
}
.story-stage .close { display: none; }
.story-progress {
  position: fixed; right: 32px; top: 50%; transform: translateY(-50%);

  display: flex; flex-direction: column; gap: 8px;
}
.story-progress .dot {
  width: 6px; height: 24px; background: var(--mbt-line-2); border-radius: 3px;
  transition: background 200ms;
}
.story-progress .dot.active { background: var(--mbt-brick); }
.story-chapter {
  height: 100vh;
  scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: 80px 80px;
  position: relative;
}
.story-chapter .ch-num { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.18em; color: var(--mbt-brick); font-weight: 600; margin-bottom: 24px; }
.story-chapter .ch-title {
  font-family: var(--font-serif);
  font-size: clamp(38px, 4.8vw, 72px);
  font-weight: 500;
  line-height: 1.15;

  max-width: 1100px;
  margin: 0 0 32px;
}
.story-chapter .ch-bignum {
  font-family: var(--font-serif);
  font-size: clamp(160px, 22vw, 360px);
  font-weight: 500;
  letter-spacing: -0.05em;
  line-height: 0.85;
  color: var(--mbt-brick);
  margin: 0 0 24px;
}
.story-chapter .ch-bignum .small { font-size: 0.25em; color: var(--mbt-gray-1); display: block; letter-spacing: 0; line-height: 1.5; margin-top: 16px; font-weight: 400; }
.story-chapter .ch-body { font-size: 20px; line-height: 1.6; color: var(--mbt-ink-2); max-width: 700px; }
.story-chapter.dark { background: var(--mbt-ink); color: #FAFAFA; }
.story-chapter.dark .ch-num { color: #E8A077; }
.story-chapter.dark .ch-bignum { color: #E8A077; }
.story-chapter.dark .ch-bignum .small { color: rgba(255,255,255,0.55); }
.story-chapter.dark .ch-body { color: #D4D2CC; }
.story-cta {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 32px;
  padding: 16px 28px;
  background: var(--mbt-brick); color: #fff;
  border-radius: 999px; font-weight: 600; font-size: 15px;
  width: max-content;
  cursor: pointer;
}

/* Buttons */
.btn-primary {
  background: var(--mbt-ink); color: #fff;
  padding: 14px 24px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer;
}
.btn-primary:hover { background: var(--mbt-brick); }
.btn-ghost {
  border: 1px solid var(--mbt-line);
  padding: 10px 18px; font-size: 13px;
  background: #fff;
}

/* Toggle pill */
.toggle-pill {
  display: inline-flex;
  background: var(--mbt-paper-2);
  border-radius: 999px;
  padding: 3px;
  font-size: 12px;
}
.toggle-pill button {
  padding: 6px 14px; border-radius: 999px;
  font-weight: 500; color: var(--mbt-gray-1);
}
.toggle-pill button.active { background: var(--mbt-ink); color: #fff; }

.book-teaser-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  padding: 20px 0 40px;
  align-items: start;
}
/* Footer */
.footer {
  border-top: 1px solid var(--mbt-ink);
  margin-top: 96px;
  padding: 40px 32px;
  font-size: 12px;
  color: var(--mbt-gray-1);
  display: flex; justify-content: space-between;
  max-width: 1320px; margin-left: auto; margin-right: auto;
}
