// ─────────────────────── Industry Bubble Map (Log Scale) ─────────────
function IndustryBubbleMapLog({ industries, onPick }) {
  const W = 1280, H = 400;
  const pad = { l: 72, r: 40, t: 40, b: 60 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;

  const revenues = industries.map(d => d.revenue);
  const logMin = Math.log10(Math.min(...revenues)) - 0.1;
  const logMax = Math.log10(Math.max(...revenues)) + 0.1;

  const margins = industries.map(d => d.avgMargin);
  const yPad = 8;
  const yMin = Math.min(-5, Math.min(...margins) - yPad);
  const yMax = Math.max(20, Math.max(...margins) + yPad);

  const sx = v => pad.l + ((Math.log10(v) - logMin) / (logMax - logMin)) * iW;
  const sy = v => pad.t + iH - ((v - yMin) / (yMax - yMin)) * iH;
  const sz = c => Math.max(20, Math.min(54, Math.sqrt(c) * 8));

  const xTicks = [1000, 3000, 5000, 10000, 30000, 50000, 100000, 300000, 500000, 1000000, 3000000, 5000000];
  const yTicks = [-5, 0, 5, 10, 15, 20];
  const zeroY = sy(0);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      {/* Zero line */}
      <line x1={pad.l} x2={W - pad.r} y1={zeroY} y2={zeroY} stroke="#B5321A" strokeDasharray="3 3" strokeWidth="1" opacity="0.4"/>

      {/* Grid */}
      {yTicks.map(t => (
        <line key={t} x1={pad.l} x2={W - pad.r} y1={sy(t)} y2={sy(t)} stroke="#E5E2DA" strokeDasharray="2 4" strokeWidth="0.8"/>
      ))}
      {yTicks.map(t => (
        <text key={t} x={pad.l - 8} y={sy(t) + 4} textAnchor="end" fontSize="14" fill="#9A988F" fontFamily="Pretendard Variable, sans-serif">{t}%</text>
      ))}
      {xTicks.map(t => {
        const x = sx(t);
        if (x < pad.l - 1 || x > W - pad.r + 1) return null;
        const label = t >= 10000000 ? (t/10000000)+"천조" : t >= 1000000 ? (t/1000000)+"백조" : t >= 10000 ? (t/10000).toFixed(1)+"조" : (t/1000)+"천억";
        return (
          <g key={t}>
            <line x1={x} x2={x} y1={pad.t} y2={pad.t + iH} stroke="#E5E2DA" strokeDasharray="2 4" strokeWidth="0.8"/>
            <text x={x} y={pad.t + iH + 20} textAnchor="middle" fontSize="13" fill="#9A988F" fontFamily="Pretendard Variable, sans-serif">{label}</text>
          </g>
        );
      })}
      <text x={pad.l + iW/2} y={H - 4} textAnchor="middle" fontSize="14" fill="#6B6B68" fontFamily="Pretendard Variable, sans-serif">2024 총매출 (로그 스케일)</text>
      <text transform={`rotate(-90) translate(${-(pad.t + iH/2)}, ${pad.l - 46})`} textAnchor="middle" fontSize="14" fill="#6B6B68" fontFamily="Pretendard Variable, sans-serif">↑ 평균 영업이익률 (%)</text>

      {/* Axes */}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + iH} y2={pad.t + iH} stroke="#111" strokeWidth="1.5"/>
      <line x1={pad.l} x2={pad.l} y1={pad.t} y2={pad.t + iH} stroke="#111" strokeWidth="1.5"/>

      {(() => {
        const FONT_SZ = 17;
        const LINE_H = 21;
        const CHAR_W = 10;
        const PAD = 5;
        // Build label data
        const pts = industries.map(ind => {
          const cx = sx(ind.revenue);
          const cy = sy(ind.avgMargin);
          const r = sz(ind.count);
          const lines = ind.name.split(/[·\s]/).filter(Boolean);
          return { ind, cx, cy, r, lines, lx: cx, ly: cy - r - 12 };
        });
        // Bounding box of label text block (top-anchored at ly)
        function bbox(p) {
          const w = Math.max(...p.lines.map(l => l.length)) * CHAR_W + PAD * 2;
          const h = p.lines.length * LINE_H + PAD;
          return { x1: p.lx - w/2, y1: p.ly - h, x2: p.lx + w/2, y2: p.ly };
        }
        function overlaps(a, b) {
          const ba = bbox(a), bb = bbox(b);
          return !(ba.x2 + 4 < bb.x1 || bb.x2 + 4 < ba.x1 || ba.y2 + 4 < bb.y1 || bb.y2 + 4 < ba.y1);
        }
        // Force-based separation (50 iterations)
        for (let it = 0; it < 60; it++) {
          for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
              if (!overlaps(pts[i], pts[j])) continue;
              let dx = pts[j].lx - pts[i].lx;
              let dy = pts[j].ly - pts[i].ly;
              const d = Math.sqrt(dx*dx + dy*dy) || 1;
              const push = 5;
              pts[i].lx -= (dx/d) * push * 0.5;
              pts[i].ly -= (dy/d) * push * 0.5;
              pts[j].lx += (dx/d) * push * 0.5;
              pts[j].ly += (dy/d) * push * 0.5;
            }
          }
        }
        // Clamp to chart area
        pts.forEach(p => {
          const w = Math.max(...p.lines.map(l => l.length)) * CHAR_W;
          p.lx = Math.max(pad.l + w/2 + 4, Math.min(W - pad.r - w/2 - 4, p.lx));
          p.ly = Math.max(pad.t + LINE_H * p.lines.length, p.ly);
        });
        return pts.map(({ ind, cx, cy, r, lines, lx, ly }) => {
          const dist = Math.sqrt((lx-cx)*(lx-cx) + (ly - (cy - r))*(ly - (cy - r)));
          const moved = dist > 14;
          return (
            <g key={ind.id} style={{ cursor: "pointer" }} onClick={() => onPick && onPick(ind)} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>
              <circle cx={cx} cy={cy} r={r} fill={ind.color} opacity="0.18"/>
              <circle cx={cx} cy={cy} r={r} fill="none" stroke={ind.color} strokeWidth="1.5" opacity="0.6"/>
              <circle cx={cx} cy={cy} r="4" fill={ind.color}/>
              {moved && <line x1={cx} y1={cy - r - 2} x2={lx} y2={ly + 2}
                stroke={ind.color} strokeWidth="0.8" opacity="0.45" strokeDasharray="3 2"/>}
              {lines.map((ln, li) => (
                <text key={li}
                  x={lx} y={ly - (lines.length - 1 - li) * LINE_H}
                  textAnchor="middle" fontSize={FONT_SZ} fontWeight="700"
                  fill={ind.color} fontFamily="Pretendard Variable, sans-serif"
                  paintOrder="stroke" stroke="white" strokeWidth="3" strokeLinejoin="round">
                  {ln}
                </text>
              ))}
            </g>
          );
        });
      })()}
    </svg>
  );
}

function IndustryScaleTable({ onView }) {
  const MODES = [
    { key: "revenue",     label: "합산 매출 순",    sub: "2024 누적 매출 기준" },
    { key: "revGrowth",   label: "매출 성장률",  sub: "2021→2024 연평균 성장률 (CAGR)" },
    { key: "profGrowth",  label: "영업이익 성장률",  sub: "2021→2024 영업이익 변화율" },
    { key: "stockGrowth", label: "주가 성장률",      sub: "상장사 2021→2024 주가 변화" },
  ];
  const [mode, setMode] = React.useState("revenue");

  const indStats = React.useMemo(() => {
    const allCos = Object.values(window.TASTE_COMPANIES);
    const stock = window.TASTE_STOCK || {};
    return window.TASTE_INDUSTRIES.map(ind => {
      const cos = allCos.filter(c => c.industry === ind.id);
      const revenue = ind.revenue;
      const revGrowths = cos.map(c => {
        const r21 = c.revenue && c.revenue["2021"], r24 = c.revenue && c.revenue["2024"];
        if (!r21 || !r24 || r21 <= 0) return null;
        return (Math.pow(r24 / r21, 1/3) - 1) * 100;
      }).filter(v => v !== null && Math.abs(v) < 200);
      const revGrowth = revGrowths.length ? revGrowths.reduce((a,b) => a+b,0)/revGrowths.length : 0;
      const profGrowths = cos.map(c => {
        const p21 = c.profit && c.profit["2021"], p24 = c.profit && c.profit["2024"];
        if (!p21 || !p24 || p21 <= 0) return null;
        return (p24 / p21 - 1) * 100;
      }).filter(v => v !== null && Math.abs(v) < 1000);
      const profGrowth = profGrowths.length ? profGrowths.reduce((a,b) => a+b,0)/profGrowths.length : 0;
      const stockGrowths = cos.map(c => {
        const hist = stock[c.name];
        if (!hist || hist.length < 6) return null;
        const early = hist.find(d => d.m >= "2021-01" && d.m <= "2021-06");
        const late  = [...hist].reverse().find(d => d.m <= "2024-12");
        if (!early || !late || early.p <= 0) return null;
        return (late.p / early.p - 1) * 100;
      }).filter(v => v !== null && Math.abs(v) < 2000);
      const stockGrowth = stockGrowths.length ? stockGrowths.reduce((a,b) => a+b,0)/stockGrowths.length : null;
      const stockCount = stockGrowths.length;
      return { ...ind, revenue, revGrowth, profGrowth, stockGrowth, stockCount };
    });
  }, []);

  const sorted = React.useMemo(() => {
    return [...indStats].sort((a, b) => {
      if (mode === "revenue")     return b.revenue - a.revenue;
      if (mode === "revGrowth")   return b.revGrowth - a.revGrowth;
      if (mode === "profGrowth")  return b.profGrowth - a.profGrowth;
      if (mode === "stockGrowth") return (b.stockGrowth ?? -9999) - (a.stockGrowth ?? -9999);
      return 0;
    });
  }, [indStats, mode]);

  const activeMode = MODES.find(m => m.key === mode);

  function fmtMetric(row) {
    if (mode === "revenue") {
      return row.revenue >= 10000
        ? (row.revenue/10000).toFixed(1) + "조"
        : Math.round(row.revenue).toLocaleString() + "억";
    }
    if (mode === "stockGrowth" && row.stockGrowth === null) {
      return <span style={{ color: "#C0BDB6", fontSize: 12 }}>-</span>;
    }
    const val = mode === "revGrowth" ? row.revGrowth
      : mode === "profGrowth" ? row.profGrowth
      : row.stockGrowth;
    const color = val > 20 ? "#1A6B5A" : val > 0 ? "#2A5A3A" : "#B5321A";
    return <span style={{ color }}>{val > 0 ? "+" : ""}{val.toFixed(1)}%</span>;
  }

  const metricLabel = mode === "revenue" ? "합산 매출"
    : mode === "revGrowth"  ? "매출 CAGR"
    : mode === "profGrowth" ? "이익 성장률"
    : "주가 성장률";

  const btnBase = { padding: "8px 18px", borderRadius: 2, fontSize: 12, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", border: "1px solid #E5E2DA", letterSpacing: "0.04em", transition: "all 120ms" };

  return (
    <div style={{ marginTop: 64 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 20 }}>
        <div>
          <span className="mono-eyebrow">Industry Scale · 산업 규모 비교</span>
          <h2 style={{ margin: "4px 0 0", fontFamily: "Fraunces, serif", fontSize: "clamp(28px,4vw,48px)", fontWeight: 500, letterSpacing: "-0.025em" }}>산업 규모 비교</h2>
        </div>
        <div style={{ fontSize: 12, color: "#9A988F" }}>{activeMode.sub}</div>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", paddingBottom: 20, borderBottom: "2px solid #111", marginBottom: 0 }}>
        {MODES.map(m => (
          <button key={m.key} onClick={() => setMode(m.key)}
            style={{ ...btnBase, background: mode === m.key ? "#111" : "#fff", color: mode === m.key ? "#fff" : "#2A2A28", borderColor: mode === m.key ? "#111" : "#E5E2DA" }}>
            {m.label}
          </button>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "40px 1.8fr 1fr 1fr 1fr", padding: "10px 16px", background: "#F7F7F7", fontSize: 11, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "#9A988F", borderBottom: "1px solid #E5E2DA", border: "1px solid #E5E2DA", borderTop: "none" }}>
        <span>#</span><span>산업</span>
        <span style={{ textAlign: "right" }}>합산 매출</span>
        <span style={{ textAlign: "right" }}>기업 수</span>
        <span style={{ textAlign: "right" }}>{metricLabel}</span>
      </div>
      <div style={{ border: "1px solid #E5E2DA", borderTop: "none", background: "#fff" }}>
        {sorted.map((ind, i) => (
          <div key={ind.id} onClick={() => onView({ name: "industry", id: ind.id })} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}
            style={{ display: "grid", gridTemplateColumns: "40px 1.8fr 1fr 1fr 1fr", padding: "15px 16px", borderBottom: "1px solid #F0EDE8", cursor: "pointer", transition: "background 120ms" }}
            onMouseEnter={e => e.currentTarget.style.background = "#F9F8F6"}
            onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
            <span style={{ fontFamily: "Fraunces, serif", color: i < 3 ? "#B5321A" : "#C0BDB6", fontSize: 14, fontWeight: 500 }}>
              {String(i+1).padStart(2, "0")}
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: ind.color, display: "inline-block", flexShrink: 0 }} />
              <span style={{ fontWeight: 600, fontSize: 14 }}>{ind.name}</span>
            </span>
            <span className="tnum" style={{ textAlign: "right", fontFamily: "Fraunces, serif", fontSize: 14, color: "#6B6B68" }}>
              {ind.revenue >= 10000 ? (ind.revenue/10000).toFixed(1)+"조" : Math.round(ind.revenue).toLocaleString()+"억"}
            </span>
            <span className="tnum" style={{ textAlign: "right", fontSize: 13, color: "#9A988F" }}>{ind.count}개사</span>
            <span className="tnum" style={{ textAlign: "right", fontFamily: "Fraunces, serif", fontSize: 15, fontWeight: 600 }}>
              {fmtMetric(ind)}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}


  </script>

  <script type="text/babel" src="./company-explorer-integration.jsx?v=0.5.2"></script>

  <script type="text/babel">

const { useState, useEffect } = React;

// ─── URL 라우팅 헬퍼 ────────────────────────────────────────
// 가독성 있는 해시: #/, #/companies, #/companies/public_id 등
function viewToHash(v) {
  if (!v || v.name === "home") return "#/";
  if (v.name === "industry") return "#/industry/" + encodeURIComponent(v.id);
  if (v.name === "company")  return "#/company/"  + encodeURIComponent(v.id);
  if (v.name === "explorer") return "#/companies" + (v.query ? "?q=" + encodeURIComponent(v.query) : "");
  if (v.name === "apiCompany") return "#/companies/" + encodeURIComponent(v.id);
  return "#/" + v.name;
}

function hashToView(hash) {
  try {
    const h = hash.replace(/^#\/?/, "");
    if (!h) return { name: "home" };
    const [path, search = ""] = h.split("?");
    const parts = path.split("/");
    if (parts[0] === "industry" && parts[1]) return { name: "industry", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "company"  && parts[1]) return { name: "company",  id: decodeURIComponent(parts[1]) };
    if (parts[0] === "companies" && parts[1]) return { name: "apiCompany", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "companies") return { name: "explorer", query: new URLSearchParams(search).get("q") || "" };
    if (parts[0] === "map") return { name: "explorer" };
    const nameMap = { story:"story", distribution:"distribution" };
    if (nameMap[parts[0]]) return { name: nameMap[parts[0]] };
    // 구버전 JSON 해시 하위호환
    const m = hash.match(/#v=(.+)/);
    if (m) return JSON.parse(decodeURIComponent(m[1]));
  } catch(e) {}
  return { name: "home" };
}

function App() {
  const [view, setView] = useState(() => hashToView(window.location.hash));
  const [rosterVersion, setRosterVersion] = useState(0);

  useEffect(() => {
    const onPop = () => {
      const v = hashToView(window.location.hash);
      setView(v);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  const handleView = (v) => {
    const hash = viewToHash(v);
    window.history.pushState({ view: v }, "", hash);
    setView(v);
    window.scrollTo(0, 0);
  };

  return (
    <>
      <PublicRosterBootstrap onReady={() => setRosterVersion(v => v + 1)} />
      <TopNav view={view} onView={handleView} />
      {view.name === "home"         && <HomeView key={"home-" + rosterVersion} onView={handleView} />}
      {view.name === "distribution" && <BrandDistributionView onView={handleView} />}
      {view.name === "industry"     && <IndustryView key={view.id + "-" + rosterVersion} industryId={view.id} onView={handleView} />}
      {view.name === "company"      && <CompanyProfileResolver companyId={view.id} onView={handleView} />}
      {view.name === "explorer"     && <CompanyExplorerView onView={handleView} initialQuery={view.query || ""} />}
      {view.name === "apiCompany"   && <ApiCompanyDetailView companyId={view.id} onView={handleView} />}
      {view.name === "story"        && <StoryMode onView={handleView} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
