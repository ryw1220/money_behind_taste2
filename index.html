<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Behind Taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <link href="./company-explorer-integration.css?v=0.5.2" rel="stylesheet">
  <style>
  :root {
    --font-sans: "Pretendard Variable", "Pretendard", system-ui, sans-serif;
    --font-serif: "Fraunces", serif;
  }
:root {
  /* Brand override — editorial palette per PRD */
  --mbt-brick: #B5321A;
  --mbt-brick-dark: #8B1A0A;
  --mbt-brick-soft: #F5E6E0;
  --mbt-green: #1A6B5A;
  --mbt-green-soft: #E3EFEB;
  --mbt-gold: #B89249;
  --mbt-ink: #111111;
  --mbt-ink-2: #2A2A28;
  --mbt-paper: #F8F7F5;
  --mbt-paper-2: #F1EFEA;
  --mbt-line: #E5E2DA;
  --mbt-line-2: #D9D5CB;
  --mbt-gray-1: #6B6B68;
  --mbt-gray-2: #9A988F;

  /* Industry colors */
  --ind-food: #B5321A;
  --ind-fashion: #1A1A1A;
  --ind-beauty: #7A2541;
  --ind-living: #2C5F4A;
  --ind-content: #DC6B2F;
  --ind-media: #2D3E68;
  --ind-pub: #5A3825;
  --ind-edu: #4A6FA5;
  --ind-commerce: #C97A3F;
  --ind-leisure: #2E8B7A;
  --ind-tech: #2D2D8C;
  --ind-mobility: #3A3A3A;

  --font-serif: "Fraunces", "Pretendard", serif;
  --font-num: "Pretendard", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background: var(--mbt-paper);
  color: var(--mbt-ink);
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
a { color: inherit; text-decoration: none; }

.tnum { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.02em; }
.mono-eyebrow {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mbt-gray-1);
}

/* ───── Top Nav ───── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248, 247, 245, 0.92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--mbt-line);
}
.topnav-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
}
.brand-mark {
  display: flex;
  align-items: baseline;
  gap: 10px;
  cursor: pointer;
}
.brand-mark .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--mbt-brick);
  display: inline-block;
  transform: translateY(-1px);
}
.brand-mark .name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.brand-mark .ko {
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: -0.02em;
}
.nav-links {
  display: flex;
  gap: 28px;
  margin-left: 24px;
  flex: 1;
}
.nav-links button {
  font-size: 14px;
  font-weight: 500;
  color: var(--mbt-ink-2);
  letter-spacing: -0.01em;
  position: relative;
  padding: 4px 0;
}
.nav-links button.active { color: var(--mbt-brick); }
.nav-links button.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
  height: 2px; background: var(--mbt-brick);
}
.nav-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--mbt-paper-2);
  border: 1px solid var(--mbt-line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 13px;
  color: var(--mbt-gray-1);
  min-width: 220px;
}
.nav-search input {
  border: none; background: transparent; outline: none;
  font-family: inherit; font-size: 13px; color: var(--mbt-ink);
  flex: 1;
}

/* ───── Page container ───── */
.page {
  max-width: 1320px;
  margin: 0 auto;
  padding: 56px 32px 96px;
}

/* ───── Hero (Home) ───── */
.hero-eyebrow {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.hero-eyebrow .rule { flex: 0 0 60px; height: 1px; background: var(--mbt-ink); }
.hero-title {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: clamp(41px, 5.1vw, 71px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 0 0 28px;
  max-width: 1100px;
}
.hero-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--mbt-brick);
}
.hero-sub {
  font-size: 15px;
  line-height: 1.65;
  color: var(--mbt-ink-2);
  max-width: 640px;
  margin: 0 0 36px;
  letter-spacing: -0.01em;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  padding: 28px 0;
  margin-bottom: 64px;
}
.hero-stats-compact {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  padding: 20px 0 20px;
  margin-bottom: 40px;
}
.hero-stat-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 20px;
  border-right: 1px solid var(--mbt-line);
}
.hero-stat-row:last-of-type {
  border-right: none;
}
.hero-stat-row .s-num {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
}
.hero-stat-row .s-num .u {
  font-size: 14px;
  color: var(--mbt-gray-1);
  margin-left: 3px;
}
.hero-stat-row .s-desc {
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: -0.01em;
  line-height: 1.4;
}
.hero-dart-note {
  font-size: 11px;
  color: var(--mbt-gray-2);
  margin: 8px 0 0;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.hero-stat { padding-right: 24px; padding-bottom: 20px; border-right: 1px solid var(--mbt-line); border-bottom: 1px solid var(--mbt-line); }
.hero-stat:last-child { border-right: none; }
.hero-stat .num {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 31px;
  line-height: 1;
  letter-spacing: -0.025em;
  margin-bottom: 6px;
}
.hero-stat .num .unit { font-size: 13px; color: var(--mbt-gray-1); margin-left: 3px; font-weight: 400; }
.hero-stat .lbl { font-size: 13px; color: var(--mbt-gray-1); letter-spacing: -0.01em; }

/* ───── Section header ───── */
.section-head {
  display: flex; align-items: end; justify-content: space-between;
  margin: 64px 0 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--mbt-ink);
}
.section-head h2 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 36px;
  margin: 8px 0 0;
  letter-spacing: -0.025em;
  line-height: 1;
}
.section-head .meta { font-size: 13px; color: var(--mbt-gray-1); }

/* ───── Industry cards ───── */
.industry-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--mbt-line);
  border: 1px solid var(--mbt-line);
}
.ind-card {
  background: var(--mbt-paper);
  padding: 18px 22px 16px;
  cursor: pointer;
  transition: background 160ms ease;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 190px;
}
.ind-card:hover { background: #fff; }
.ind-card .head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.ind-card .num-badge {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--mbt-gray-1);
  letter-spacing: 0.05em;
}
.ind-card .stripe {
  width: 28px; height: 3px; background: var(--c); border-radius: 2px;
}
.ind-card .name {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.ind-card .rev {
  font-size: 13px; color: var(--mbt-gray-1);
}
.ind-card .rev .b {
  font-family: var(--font-serif); font-size: 18px; font-weight: 500; color: var(--mbt-ink); margin-right: 4px;
}
.ind-card .top3 {
  font-size: 12px; color: var(--mbt-ink-2); display: flex; flex-direction: column; gap: 3px;
  border-top: 1px dashed var(--mbt-line);
  padding-top: 12px;
  margin-top: auto;
}
.ind-card .top3 li { display: flex; justify-content: space-between; }
.ind-card .top3 li span:last-child { color: var(--mbt-gray-1); font-variant-numeric: tabular-nums; }
.ind-card ul { list-style: none; padding: 0; margin: 0; }


/* ───── Editorial features ───── */
.features {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 24px;
}
.feature {
  cursor: pointer;
  border-top: 2px solid var(--mbt-ink);
  padding-top: 20px;
  display: flex; flex-direction: column;
  min-height: 320px;
}
.feature.hero {
  grid-row: span 2;
  border-top: 4px solid var(--mbt-brick);
}
.feature .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mbt-brick); font-weight: 600; margin-bottom: 14px; }
.feature h3 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.025em;
  line-height: 1.15;
  margin: 0 0 14px;
}
.feature.hero h3 { font-size: 32px; line-height: 1.1; }
.feature p { font-size: 14px; color: var(--mbt-ink-2); line-height: 1.65; margin: 0 0 18px; }
.feature .read { margin-top: auto; font-size: 13px; color: var(--mbt-brick); font-weight: 500; }
.feature .stat-inline {
  font-family: var(--font-serif);
  font-size: 56px;
  letter-spacing: -0.03em;
  color: var(--mbt-brick);
  line-height: 1;
  margin: 8px 0 16px;
}
.feature .stat-inline .small { font-size: 18px; color: var(--mbt-gray-1); }
.feature .visual {
  height: 140px;
  background: var(--mbt-paper-2);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

/* ───── Bubble map ───── */
.bubble-wrap {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 32px 28px;
  position: relative;
}
.bubble-wrap h3 {
  font-family: var(--font-serif);
  font-size: 24px; margin: 0 0 6px; font-weight: 500; letter-spacing: -0.02em;
}
.bubble-wrap .desc { font-size: 13px; color: var(--mbt-gray-1); margin-bottom: 18px; }

/* ───── Industry View ───── */
.ind-hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
  border-bottom: 1px solid var(--mbt-ink);
  padding-bottom: 36px;
  margin-bottom: 32px;
}
.ind-hero .label { font-size: 13px; color: var(--c); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 18px; }
.ind-hero h1 {
  font-family: var(--font-serif);
  font-size: 72px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 0.95;
  margin: 0 0 20px;
}
.ind-hero .sum { font-size: 17px; color: var(--mbt-ink-2); line-height: 1.65; }
.ind-hero .stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
  border-top: 1px solid var(--mbt-line);
}
.ind-hero .stats .s {
  border-bottom: 1px solid var(--mbt-line);
  border-right: 1px solid var(--mbt-line);
  padding: 20px 16px;
}
.ind-hero .stats .s:nth-child(3n) { border-right: none; }
.ind-hero .stats .num { font-family: var(--font-serif); font-size: 36px; letter-spacing: -0.025em; font-weight: 500; line-height: 1; }
.ind-hero .stats .num .u { font-size: 14px; color: var(--mbt-gray-1); margin-left: 4px; }
.ind-hero .stats .lbl { font-size: 12px; color: var(--mbt-gray-1); margin-top: 6px; }

/* Industry dashboard layout */
.dash-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}
.dash-card {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 28px 26px;
}
.dash-card h3 {
  font-family: var(--font-serif);
  font-size: 22px; font-weight: 500; letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.dash-card .sub { font-size: 12px; color: var(--mbt-gray-1); margin-bottom: 22px; }

/* Insight box (editorial) */
.insight-box {
  border-left: 3px solid var(--mbt-brick);
  padding: 4px 18px;
  margin: 18px 0;
}
.insight-box .label { font-size: 10px; letter-spacing: 0.2em; color: var(--mbt-brick); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
.insight-box p { font-family: var(--font-serif); font-size: 17px; line-height: 1.5; margin: 0; letter-spacing: -0.01em; color: var(--mbt-ink); }

/* Company list table */
.co-table {
  background: #fff;
  border: 1px solid var(--mbt-line);
  width: 100%;
}
.co-table .row {
  display: grid;
  grid-template-columns: 36px 2fr 1fr 1fr 1fr 1fr 80px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--mbt-line);
  font-size: 13px;
  cursor: pointer;
  transition: background 120ms;
}
.co-table .row:last-child { border-bottom: none; }
.co-table .row:hover { background: var(--mbt-paper-2); }
.co-table .row.head {
  background: var(--mbt-paper-2);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--mbt-gray-1); font-weight: 600;
  cursor: default;
}
.co-table .row.head:hover { background: var(--mbt-paper-2); }
.co-table .rank { font-family: var(--font-serif); color: var(--mbt-gray-1); }
.co-table .name { font-weight: 600; color: var(--mbt-ink); }
.co-table .num { font-variant-numeric: tabular-nums; }
.co-table .pos { color: var(--mbt-green); font-weight: 600; }
.co-table .neg { color: var(--mbt-brick); font-weight: 600; }
.co-table .arrow { color: var(--mbt-gray-2); text-align: right; }
@media (max-width: 640px) {
  .co-table .row {
    grid-template-columns: 30px 1fr auto 24px;
    padding: 12px 14px;
    gap: 0 8px;
  }
  .co-table .row .col-margin,
  .co-table .row .col-growth,
  .co-table .row .col-emp { display: none; }
  .co-table .row.head .col-margin,
  .co-table .row.head .col-growth,
  .co-table .row.head .col-emp { display: none; }
  .co-table .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* Revenue chart + table responsive grid */
.rev-chart-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 20px;
  align-items: start;
  margin-bottom: 24px;
}
@media (max-width: 640px) {
  .rev-chart-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .ind-hero { grid-template-columns: 1fr; gap: 24px; }
  .dash-grid { grid-template-columns: 1fr; }
  .ind-hero h1 { font-size: 48px; }
}

/* ───── Company detail ───── */
.co-hero {
  border-bottom: 1px solid var(--mbt-ink);
  padding-bottom: 36px;
  margin-bottom: 36px;
}
.co-breadcrumb {
  display: flex; gap: 8px; align-items: center;
  font-size: 12px; color: var(--mbt-gray-1);
  margin-bottom: 24px;
}
.co-breadcrumb .crumb { cursor: pointer; }
.co-breadcrumb .crumb:hover { color: var(--mbt-brick); }
.co-breadcrumb .sep { color: var(--mbt-line-2); }
.co-meta {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 18px;
}
.co-tag {
  font-size: 11px; padding: 4px 10px; border: 1px solid var(--c, var(--mbt-line)); color: var(--c, var(--mbt-ink-2));
  border-radius: 999px; letter-spacing: 0.04em; font-weight: 500;
}
.co-tag.solid {
  background: var(--c); color: #fff; border-color: var(--c);
}
.co-tag.listed { color: var(--mbt-green); border-color: var(--mbt-green); }
.co-tag.unlisted { color: var(--mbt-gray-1); border-color: var(--mbt-line-2); }
.co-name {
  font-family: var(--font-serif);
  font-size: clamp(56px, 6.5vw, 92px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 0.95;
  margin: 0 0 18px;
}
.co-desc {
  font-size: 17px; color: var(--mbt-ink-2); line-height: 1.65; max-width: 720px;
  margin: 0 0 28px;
}
.co-info-row {
  display: flex; gap: 32px; flex-wrap: wrap;
  font-size: 13px; color: var(--mbt-gray-1);
}
.co-info-row .item .l { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.co-info-row .item .v { color: var(--mbt-ink); font-weight: 500; }

/* KPI block */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0;
  border-top: 1px solid var(--mbt-ink);
  border-bottom: 1px solid var(--mbt-line);
  margin-bottom: 48px;
}
@media (max-width: 640px) {
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
.kpi {
  padding: 20px 12px 18px 16px;
  border-right: 1px solid var(--mbt-line);
}
.kpi:first-child { padding-left: 0; }
.kpi:last-child { border-right: none; }
.kpi .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mbt-gray-1); margin-bottom: 14px; }
.kpi .val {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi .val .u { font-size: 16px; color: var(--mbt-gray-1); margin-left: 3px; font-weight: 400; }
.kpi .delta {
  margin-top: 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.kpi .delta.pos { color: var(--mbt-green); }
.kpi .delta.neg { color: var(--mbt-brick); }
.kpi .delta .arrow { display: inline-block; margin-right: 4px; }

/* Charts */
.chart-card {
  background: #fff;
  border: 1px solid var(--mbt-line);
  padding: 32px 32px 28px;
  margin-bottom: 24px;
}
.chart-card .head {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--mbt-line);
}
.chart-card .head .left { display: flex; flex-direction: column; gap: 6px; }
.chart-card .head .eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mbt-gray-1); font-weight: 600; }
.chart-card .head h3 {
  font-family: var(--font-serif);
  font-size: 28px; font-weight: 500; letter-spacing: -0.025em;
  margin: 0;
}
.chart-card .legend { display: flex; gap: 20px; font-size: 12px; color: var(--mbt-gray-1); }
.chart-card .legend .item { display: flex; align-items: center; gap: 6px; }
.chart-card .legend .sw { width: 14px; height: 8px; border-radius: 2px; }

/* Two-up grid */
.two-up { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-bottom: 24px; }
@media (max-width: 640px) {
  .two-up { grid-template-columns: 1fr; }
  .chart-card { padding: 22px 18px 20px; }
  .chart-card .head h3 { font-size: 22px; }
}

/* Brand cards */
.brand-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--mbt-line);
  border: 1px solid var(--mbt-line);
}
.brand-card {
  background: #fff;
  padding: 22px 20px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 130px;
  cursor: pointer;
  transition: background 120ms;
}

/* Investment points */
.invest-points { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

.invest-col.pos h4 .badge { background: var(--mbt-green); }

.invest-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.invest-col li {

.invest-col li .h { font-weight: 600; font-size: 14px; margin-bottom: 4px; }

/* ───── Story Mode ───── */
html.story-snap { scroll-snap-type: y mandatory; }
.story-stage {
  background: var(--mbt-paper);
}
.story-stage .close { display: none; }
.story-progress {
  position: fixed; right: 32px; top: 50%; transform: translateY(-50%);

  display: flex; flex-direction: column; gap: 8px;
}
.story-progress .dot {
  width: 6px; height: 24px; background: var(--mbt-line-2); border-radius: 3px;
  transition: background 200ms;
}
.story-progress .dot.active { background: var(--mbt-brick); }
.story-chapter {
  height: 100vh;
  scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: 80px 80px;
  position: relative;
}
.story-chapter .ch-num { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.18em; color: var(--mbt-brick); font-weight: 600; margin-bottom: 24px; }
.story-chapter .ch-title {
  font-family: var(--font-serif);

  margin: 0 0 32px;
}
.story-chapter .ch-bignum {
  font-family: var(--font-serif);
  font-size: clamp(160px, 22vw, 360px);
  font-weight: 500;
  letter-spacing: -0.05em;
  line-height: 0.85;
  color: var(--mbt-brick);
  margin: 0 0 24px;
}
.story-chapter .ch-bignum .small { font-size: 0.25em; color: var(--mbt-gray-1); display: block; letter-spacing: 0; line-height: 1.5; margin-top: 16px; font-weight: 400; }
.story-chapter .ch-body { font-size: 20px; line-height: 1.6; color: var(--mbt-ink-2); max-width: 700px; }
.story-chapter.dark { background: var(--mbt-ink); color: #FAFAFA; }
.story-chapter.dark .ch-num { color: #E8A077; }
.story-chapter.dark .ch-bignum { color: #E8A077; }
.story-chapter.dark .ch-bignum .small { color: rgba(255,255,255,0.55); }
.story-chapter.dark .ch-body { color: #D4D2CC; }
.story-cta {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 32px;
  padding: 16px 28px;
  background: var(--mbt-brick); color: #fff;
  border-radius: 999px; font-weight: 600; font-size: 15px;
  width: max-content;
  cursor: pointer;
}

/* Buttons */
.btn-primary {
  background: var(--mbt-ink); color: #fff;
  padding: 14px 24px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer;
}
.btn-primary:hover { background: var(--mbt-brick); }
.btn-ghost {
  border: 1px solid var(--mbt-line);
  padding: 10px 18px; font-size: 13px;
  background: #fff;
}

/* Toggle pill */
.toggle-pill {
  display: inline-flex;
  background: var(--mbt-paper-2);
  border-radius: 999px;
  padding: 3px;
  font-size: 12px;
}
.toggle-pill button {
  padding: 6px 14px; border-radius: 999px;
  font-weight: 500; color: var(--mbt-gray-1);
}
.toggle-pill button.active { background: var(--mbt-ink); color: #fff; }

.book-teaser-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  padding: 20px 0 40px;
  align-items: start;
}
/* Footer */
.footer {
  border-top: 1px solid var(--mbt-ink);
  margin-top: 96px;
  padding: 40px 32px;
  font-size: 12px;

  <script type="text/babel">
/* Money Behind Taste — Charts (custom SVG)
   All charts are hand-rolled inline SVG with the editorial style: minimal axes,
   tabular numbers, label-on-data-point, soft area fills.
*/

const NS = "http://www.w3.org/2000/svg";

// ── helper: format big won (억/조) ─────────────────────────────────
function fmtKR(n) {
  if (n == null) return "";
  if (Math.abs(n) >= 10000) {
    const cho = n / 10000;
    return cho.toFixed(cho >= 100 ? 0 : 1) + "조";
  }
  return Math.round(n).toLocaleString() + "억";
}
function fmtPct(n, sign = false) {
  if (n == null) return "";
  return (sign && n > 0 ? "+" : "") + n.toFixed(1) + "%";
}

// ── Chart 1: Revenue + Profit margin (combo bar+line) ──────────────
function RevenueTable({ data, color }) {
  const years = Object.keys(data.revenue).sort();
  const latestActual = years[years.length - 1]; // 2025 실적 기준
  return (
    <div style={{ border: "1px solid #E5E2DA", fontSize: 13, flexShrink: 0 }}>
      <div style={{ display: "grid", gridTemplateColumns: "52px 1fr 1fr", padding: "9px 14px",
        background: "#F7F7F7", fontSize: 10, fontWeight: 600, letterSpacing: "0.08em",
        textTransform: "uppercase", color: "#9A988F", borderBottom: "1px solid #E5E2DA" }}>
        <span>연도</span>
        <span style={{ textAlign: "right" }}>매출 (억)</span>
        <span style={{ textAlign: "right" }}>영업이익 (억)</span>
      </div>
      {years.map((y) => {
        const rev = data.revenue[y];
        const margin = data.margins[y];
        const profit = Math.round(rev * margin / 100);
        const isLatest = y === latestActual;
        const isEst = parseInt(y) >= 2025;
        return (
          <div key={y} style={{
            display: "grid", gridTemplateColumns: "52px 1fr 1fr",
            padding: "10px 14px", borderBottom: "1px solid #F0EDE8",
            background: isLatest ? "rgba(0,0,0,0.025)" : "transparent"
          }}>
            <span style={{ fontFamily: "Fraunces, serif", color: isEst ? "#9A988F" : "#6B6B68", fontSize: 13 }}>
              {y}{isEst ? "E" : ""}
            </span>
            <span className="tnum" style={{ textAlign: "right", fontFamily: "Fraunces, serif",
              fontWeight: isLatest ? 600 : 400, fontSize: 14,
              color: isLatest ? color : "#111" }}>
              {Math.round(rev).toLocaleString()}
            </span>
            <span className="tnum" style={{ textAlign: "right", fontFamily: "Fraunces, serif",
              fontSize: 14, fontWeight: isLatest ? 600 : 400,
              color: margin > 15 ? "#1A6B5A" : margin > 5 ? "#111" : "#B5321A" }}>
              {profit > 0 ? "" : ""}{profit.toLocaleString()}
            </span>
          </div>
        );
      })}
      <div style={{ padding: "8px 14px", fontSize: 10, color: "#9A988F", letterSpacing: "0.04em" }}>
        DART 기반 · E = 추정치
      </div>
    </div>
  );
}

function RevenueProfitChart({ data, color = "#B5321A" }) {
  const years = Object.keys(data.revenue);
  const W = 640, H = 360;
  const pad = { l: 56, r: 56, t: 30, b: 50 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const maxRev = Math.max(...years.map(y => data.revenue[y])) * 1.1;
  const barW = innerW / years.length * 0.55;
  const step = innerW / years.length;

  const marginVals = years.map(y => data.margins[y]);
  const maxMargin = Math.max(...marginVals) * 1.4;

  const xC = i => pad.l + step * i + step / 2;
  const yRev = v => pad.t + innerH - (v / maxRev) * innerH;
  const yMar = v => pad.t + innerH - (v / maxMargin) * innerH;

  // gridlines
  const gridLines = [0.25, 0.5, 0.75, 1].map(t => pad.t + innerH - t * innerH);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      {/* horizontal grid */}
      {gridLines.map((y, i) => (
        <line key={i} x1={pad.l} x2={W - pad.r} y1={y} y2={y}
          stroke="#E5E2DA" strokeWidth="1" strokeDasharray={i === 3 ? "" : "2 4"} />
      ))}
      {/* baseline */}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + innerH} y2={pad.t + innerH} stroke="#111" strokeWidth="1" />

      {/* bars */}
      {years.map((y, i) => {
        const v = data.revenue[y];
        const yT = yRev(v);
        const opacity = i === years.length - 2 ? 1 : i === years.length - 1 ? 0.45 : 0.35 + i * 0.13;
        return (
          <g key={y}>
            <rect x={xC(i) - barW / 2} y={yT}
              width={barW} height={pad.t + innerH - yT}
              fill={color} opacity={opacity} />
            {/* value label */}
            <text x={xC(i)} y={yT - 12} textAnchor="middle"
              fontFamily="Fraunces, serif" fontSize="14" fontWeight="500" fill="#111">
              {fmtKR(v)}
            </text>
            {/* growth label */}
            {data.growthLabels[y] != null && (
              <text x={xC(i)} y={yT - 28} textAnchor="middle"
                fontSize="10" fontWeight="600" fill="#1A6B5A" letterSpacing="-0.01em">
                ▲ +{data.growthLabels[y].toFixed(1)}%
              </text>
            )}
            {/* x-axis label */}
            <text x={xC(i)} y={pad.t + innerH + 22} textAnchor="middle"
              fontSize="11" fill="#6B6B68" letterSpacing="0.04em">
              {y}
            </text>
          </g>
        );
      })}

      {/* margin line */}
      <polyline
        fill="none"
        stroke="#1A6B5A"
        strokeWidth="2"
        points={years.map((y, i) => `${xC(i)},${yMar(data.margins[y])}`).join(" ")}
      />
      {years.map((y, i) => (
        <g key={"m" + y}>
          <circle cx={xC(i)} cy={yMar(data.margins[y])} r="4" fill="#fff" stroke="#1A6B5A" strokeWidth="2" />
          <text x={xC(i) + 10} y={yMar(data.margins[y]) - 8}
            fontSize="11" fontWeight="600" fill="#1A6B5A">
            {data.margins[y].toFixed(1)}%
          </text>
        </g>
      ))}

      {/* Y-axis units */}
      <text x={pad.l - 8} y={pad.t + 4} textAnchor="end" fontSize="10" fill="#9A988F" letterSpacing="0.1em">매출</text>
      <text x={W - pad.r + 8} y={pad.t + 4} textAnchor="start" fontSize="10" fill="#1A6B5A" letterSpacing="0.1em">이익률</text>

      {/* annotation */}
      {data.annotation && (() => {
        const i = years.indexOf(String(data.annotation.year));
        if (i < 0) return null;
        const x = xC(i);
        return (
          <g>
            <line x1={x} x2={x} y1={pad.t + innerH} y2={pad.t + 8} stroke="#B5321A" strokeWidth="1" strokeDasharray="3 3" opacity="0.6" />
            <foreignObject x={x - 90} y={pad.t - 22} width="180" height="44">
              <div xmlns="http://www.w3.org/1999/xhtml" style={{
                fontSize: "10px", color: "#B5321A", textAlign: "center",
                fontStyle: "italic", lineHeight: 1.3, fontFamily: "Fraunces, serif",
              }}>
                <div style={{ display: "inline-block", borderTop: "1px solid #B5321A", paddingTop: 4 }}>
                  {data.annotation.text}
                </div>
              </div>
            </foreignObject>
          </g>
        );
      })()}
    </svg>
  );
}

// ── Chart 2: Stock area chart ──────────────────────────────────────
function StockChart({ data, color = "#1A6B5A" }) {
  const [hover, setHover] = React.useState(null);
  const W = 720, H = 300;
  const pad = { l: 50, r: 50, t: 24, b: 58 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const ps = data.map(d => d.p);
  const minP = Math.min(...ps) * 0.96;
  const maxP = Math.max(...ps) * 1.04;
  const x = i => pad.l + (i / (data.length - 1)) * iW;
  const y = v => pad.t + iH - ((v - minP) / (maxP - minP)) * iH;

  const linePath = data.map((d, i) => `${i === 0 ? "M" : "L"}${x(i)},${y(d.p)}`).join(" ");
  const areaPath = `${linePath} L${x(data.length - 1)},${pad.t + iH} L${x(0)},${pad.t + iH} Z`;

  const first = data[0].p, last = data[data.length - 1].p;
  const ret = ((last - first) / first) * 100;

  // 반기별 x축 라벨 (6개월마다)
  function fmtM(m) {
    if (!m) return "";
    const [yyyy, mm] = m.split("-");
    return `${yyyy.slice(2)}년 ${parseInt(mm)}월`;
  }
  const quarterIdx = data.map((d, i) => i).filter(i => i % 6 === 0);

  // hover 툴팁 위치 보정
  const tipX = hover !== null ? x(hover) : 0;
  const tipY = hover !== null ? y(data[hover].p) : 0;
  const tipLeft = tipX > W - 130 ? tipX - 110 : tipX + 10;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}
      onMouseLeave={() => setHover(null)}>
      <defs>
        <linearGradient id="stockGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {/* gridlines */}
      {[0.25, 0.5, 0.75].map(t => (
        <line key={t} x1={pad.l} x2={W - pad.r} y1={pad.t + iH * t} y2={pad.t + iH * t}
          stroke="#E5E2DA" strokeDasharray="2 4" />
      ))}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + iH} y2={pad.t + iH} stroke="#111" />
      <path d={areaPath} fill="url(#stockGrad)" />
      <path d={linePath} fill="none" stroke={color} strokeWidth="2" />

      {/* 분기별 x축 라벨 */}
      {quarterIdx.map(i => {
        const m = data[i] && data[i].m ? fmtM(data[i].m) : "";
        const xi = x(i);
        // 첫번째와 마지막은 항상 표시, 나머지는 공간 체크
        return (
          <g key={i}>
            <line x1={xi} x2={xi} y1={pad.t + iH} y2={pad.t + iH + 4} stroke="#9A988F" strokeWidth="0.8"/>

              fontFamily="Pretendard Variable, sans-serif">
              {m}
            </text>
          </g>
        );
      })}

      {/* 호버 감지 영역 */}
      {data.map((d, i) => {
        const slotW = iW / data.length;
        return (
          <rect key={i}
            x={x(i) - slotW / 2} y={pad.t}
            width={slotW} height={iH}
            fill="transparent"
            onMouseEnter={() => setHover(i)} />
        );
      })}

      {/* 호버 라인 + 점 */}
      {hover !== null && (
        <g pointerEvents="none">
          <line x1={tipX} x2={tipX} y1={pad.t} y2={pad.t + iH}
            stroke="#9A988F" strokeWidth="1" strokeDasharray="3 2" opacity="0.7"/>
          <circle cx={tipX} cy={tipY} r="5" fill="white" stroke={color} strokeWidth="2"/>

      {/* end marker */}
      <circle cx={x(data.length - 1)} cy={y(last)} r="5" fill={color} />

          {ret > 0 ? "+" : ""}{ret.toFixed(1)}%
        </text>
      </g>
    </svg>

// ── Chart 3: Industry positioning bar (horizontal compare) ─────────
function PositionBar({ items, metric = "margin", currentColor = "#B5321A" }) {
  const sorted = [...items].sort((a, b) => b[metric] - a[metric]);
  const max = Math.max(...sorted.map(d => d[metric]));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {sorted.map((it) => {
        const w = (it[metric] / max) * 100;
        const isMe = it.current;
        return (
          <div key={it.name} style={{ position: "relative" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, fontSize: 13 }}>
              <span style={{ fontWeight: isMe ? 700 : 500, color: isMe ? currentColor : "#2A2A28" }}>
                {it.name} {isMe && <span style={{ fontSize: 10, padding: "2px 6px", background: currentColor, color: "#fff", borderRadius: 3, marginLeft: 6, letterSpacing: "0.08em" }}>현재</span>}
              </span>
              <span className="tnum" style={{ fontFamily: "Fraunces, serif", fontWeight: 500, color: isMe ? currentColor : "#111" }}>
                {metric === "margin" ? it.margin.toFixed(1) + "%" : fmtKR(it.revenue)}
              </span>
            </div>
            <div style={{ height: 8, background: "#F1EFEA", borderRadius: 1 }}>
              <div style={{
                width: w + "%", height: "100%",
                background: isMe ? currentColor : "#9A988F",
                opacity: isMe ? 1 : 0.45,
                transition: "width 600ms ease",
              }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Chart 4: Industry top10 horizontal bars ────────────────────────
function TopBarsChart({ items, color = "#B5321A" }) {
  const max = Math.max(...items.map(d => d.v));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {items.map((it, i) => (
        <div key={it.name} style={{ display: "grid", gridTemplateColumns: "24px 120px 1fr 80px", gap: 10, alignItems: "center", fontSize: 13 }}>
          <span style={{ fontFamily: "Fraunces, serif", color: "#9A988F", fontSize: 12 }}>{String(i + 1).padStart(2, "0")}</span>
          <span style={{ fontWeight: 600 }}>{it.name}</span>

            }} />

          </span>
        </div>
      ))}
    </div>
  );
}

// ── Chart 5: Scatter (revenue × margin) ────────────────────────────
function ScatterChart({ items, color = "#B5321A" }) {
  const W = 520, H = 360;
  const pad = { l: 50, r: 30, t: 24, b: 44 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const xMax = Math.max(...items.map(d => d.x)) * 1.1;
  const yMin = Math.min(0, ...items.map(d => d.y));
  const yMax = Math.max(...items.map(d => d.y)) * 1.1;
  const sx = v => pad.l + (v / xMax) * iW;
  const sy = v => pad.t + iH - ((v - yMin) / (yMax - yMin)) * iH;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      {/* axes */}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + iH} y2={pad.t + iH} stroke="#111" />
      <line x1={pad.l} x2={pad.l} y1={pad.t} y2={pad.t + iH} stroke="#E5E2DA" />
      {/* zero line if applicable */}
      {yMin < 0 && (
        <line x1={pad.l} x2={W - pad.r} y1={sy(0)} y2={sy(0)} stroke="#E5E2DA" strokeDasharray="2 3" />
      )}
      {/* points */}
      {items.map((d) => {
        const r = Math.max(5, Math.min(24, Math.sqrt(d.r || d.x) * 0.4));
        return (
          <g key={d.name}>
            <circle cx={sx(d.x)} cy={sy(d.y)} r={r} fill={color} opacity="0.18" />
            <circle cx={sx(d.x)} cy={sy(d.y)} r="4" fill={color} />
            <text x={sx(d.x) + r + 4} y={sy(d.y) + 4} fontSize="11" fontWeight="500" fill="#2A2A28">
              {d.name}
            </text>
          </g>
        );
      })}
      {/* axis labels */}
      <text x={pad.l} y={H - 10} fontSize="10" fill="#6B6B68" letterSpacing="0.08em">매출 →</text>
      <text x={pad.l - 8} y={pad.t - 6} textAnchor="end" fontSize="10" fill="#6B6B68" letterSpacing="0.08em">↑ 영업이익률</text>
    </svg>
  );
}

// ── Chart 6: Industry-bubble landscape (Home) ──────────────────────
function IndustryBubbleMap({ industries, onPick }) {
  const W = 1200, H = 480;
  const pad = { l: 70, r: 60, t: 30, b: 60 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const xMax = Math.max(...industries.map(d => d.revenue)) * 1.08;
  const yMin = Math.min(...industries.map(d => d.growth)) - 2;
  const yMax = Math.max(...industries.map(d => d.growth)) + 2;
  const sx = v => pad.l + (v / xMax) * iW;
  const sy = v => pad.t + iH - ((v - yMin) / (yMax - yMin)) * iH;
  const sz = c => Math.max(14, Math.min(48, c * 2.6));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      {/* grid */}
      {[0.25, 0.5, 0.75].map(t => (
        <line key={t} x1={pad.l} x2={W - pad.r} y1={pad.t + iH * t} y2={pad.t + iH * t} stroke="#E5E2DA" strokeDasharray="2 4" />
      ))}
      {[0.25, 0.5, 0.75].map(t => (
        <line key={"v" + t} y1={pad.t} y2={pad.t + iH} x1={pad.l + iW * t} x2={pad.l + iW * t} stroke="#E5E2DA" strokeDasharray="2 4" />
      ))}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + iH} y2={pad.t + iH} stroke="#111" />
      <line x1={pad.l} x2={pad.l} y1={pad.t} y2={pad.t + iH} stroke="#111" />
      {/* zero growth ref */}
      <line x1={pad.l} x2={W - pad.r} y1={sy(0)} y2={sy(0)} stroke="#B5321A" strokeDasharray="3 3" opacity="0.4" />

      {industries.map(ind => (
        <g key={ind.id} style={{ cursor: "pointer" }} onClick={() => onPick && onPick(ind)} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>
          <circle cx={sx(ind.revenue)} cy={sy(ind.growth)} r={sz(ind.count)}
            fill={ind.color} opacity="0.16" />
          <circle cx={sx(ind.revenue)} cy={sy(ind.growth)} r="4" fill={ind.color} />
          <text x={sx(ind.revenue)} y={sy(ind.growth) - sz(ind.count) - 6}
            textAnchor="middle" fontSize="12" fontWeight="600" fill="#111">
            {ind.short || ind.name}
          </text>
        </g>
      ))}
      <text x={pad.l} y={H - 18} fontSize="10" fill="#6B6B68" letterSpacing="0.1em">매출 규모 →</text>
      <text x={pad.l - 12} y={pad.t - 8} fontSize="10" fill="#6B6B68" letterSpacing="0.1em">↑ 5년 성장률 (%)</text>
    </svg>
  );
}

  const subcatStats = useMemo(() => {
    const cos = Object.values(window.TASTE_COMPANIES).filter(c => c.industry === ind.id);
    const out = {};
    subcatList.forEach(sc => {
      const group = cos.filter(c => (subcatMap[c.name] || "기타") === sc);
      const totalRev    = group.reduce((s, c) => s + (c.revenue["2024"]   || 0), 0);
      const totalProfit = group.reduce((s, c) => s + (c.profit  && c.profit["2024"] != null ? c.profit["2024"] : 0), 0);
      const margins     = group.map(c => c.margins?.["2024"]).filter(m => typeof m === 'number');
      const avgMargin   = margins.length ? margins.reduce((a, b) => a + b, 0) / margins.length : 0;
      out[sc] = { count: group.length, totalRev, totalProfit, avgMargin };
    });
    return out;
  }, [ind.id]);

  const allSorted = useMemo(() => {
    let cos = Object.values(window.TASTE_COMPANIES).filter(c => c.industry === ind.id);
    if (activeSubcat) cos = cos.filter(c => (subcatMap[c.name] || "기타") === activeSubcat);
    return cos.sort((a, b) => {
      if (sortBy === "revenue") return (b.revenue["2025"] || b.revenue["2024"] || 0) - (a.revenue["2025"] || a.revenue["2024"] || 0);
      if (sortBy === "margin")  return (b.margins?.["2025"] || b.margins?.["2024"] || 0) - (a.margins?.["2025"] || a.margins?.["2024"] || 0);
      if (sortBy === "growth")  return (b.growthLabels?.["2025"] || b.growthLabels?.["2024"] || 0) - (a.growthLabels?.["2025"] || a.growthLabels?.["2024"] || 0);
      return 0;
    }).map(c => ({ name: c.name, v: c.revenue["2025"] || c.revenue["2024"] || 0 }));
  }, [ind.id, sortBy, activeSubcat]);

  const scatter = useMemo(() => top10.slice(0, 8).map((c) => {
    const coData = window.TASTE_COMPANIES[c.name];
    const margin = coData ? (coData.margins["2024"] || 0) : 5;
    return { name: c.name, x: c.v, y: Math.max(0, margin), r: c.v };
  }), [top10]);

  const trend = useMemo(() => {
    const base = ind.revenue * 0.78;
    return [2021, 2022, 2023, 2024, 2025].map((y, i) => ({
      y, v: Math.round(base * Math.pow(1 + ind.growth / 100, i)),
    }));
  }, [ind]);

  const totalCount = Object.values(window.TASTE_COMPANIES).filter(c => c.industry === ind.id).length;

  function fmtRev(v) {
    if (v >= 10000) return (v / 10000).toFixed(1) + "조";
    if (v >= 1000)  return (v / 1000).toFixed(0)  + "천억";
    return Math.round(v).toLocaleString() + "억";
  }
  function fmtProfit(v) {
    if (v === 0) return "—";
    const abs = Math.abs(v);
    const sign = v < 0 ? "−" : "";
    if (abs >= 10000) return sign + (abs / 10000).toFixed(1) + "조";
    if (abs >= 1000)  return sign + (abs / 1000).toFixed(1)  + "천억";
    return sign + Math.round(abs).toLocaleString() + "억";
  }

  return (
    <main className="page">
      <div className="co-breadcrumb">
        <span className="crumb" onClick={() => onView({ name: "home" })} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>홈</span>
        <span className="sep">/</span>
        <span className="crumb">산업</span>
        <span className="sep">/</span>
        <span style={{ color: ind.color, fontWeight: 600 }}>{ind.name}</span>
      </div>

      <section className="ind-hero" style={{ "--c": ind.color }}>
        <div>
          <div className="label">Industry Dashboard</div>
          <h1>{ind.name}</h1>
          <p className="sum">{ind.desc}</p>
        </div>
        <div className="stats">
          <div className="s">
            <div className="num tnum">{(indRevLatest / 10000).toFixed(1)}<span className="u">조 원</span></div>
            <div className="lbl">2025 합산 매출</div>
          </div>
          <div className="s">
            <div className="num tnum">{totalCount}<span className="u">개사</span></div>
            <div className="lbl">분석 대상 기업</div>
          </div>
          <div className="s">
            <div className="num tnum" style={{ color: ind.growth > 0 ? "#1A6B5A" : "#B5321A" }}>
              {ind.growth > 0 ? "+" : ""}{ind.growth}<span className="u">%</span>
            </div>
            <div className="lbl">5년 연평균 성장률</div>
          </div>
          <div className="s">
            <div className="num tnum" style={{ fontSize: 28 }}>{(window.TASTE_IND_SALARY?.[ind.id]?.all || 0).toLocaleString()}<span className="u">만원</span></div>
            <div className="lbl">업계 평균 연봉</div>
          </div>
          <div className="s">
            <div className="num tnum" style={{ fontSize: 28 }}>{(window.TASTE_IND_SALARY?.[ind.id]?.listed || 0).toLocaleString()}<span className="u">만원</span></div>
            <div className="lbl">상장사 평균 연봉</div>
          </div>
          <div className="s">
            <div className="num tnum" style={{ fontSize: 28 }}>{(window.TASTE_IND_SALARY?.[ind.id]?.unlisted || 0).toLocaleString()}<span className="u">만원</span></div>
            <div className="lbl">비상장사 평균 연봉</div>
          </div>
        </div>
      </section>

      <div className="dash-grid">
        <div className="dash-card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "end", marginBottom: 18 }}>
            <div>
              <span className="mono-eyebrow">Sector Trend</span>
              <h3>합산 매출 트렌드 · 2021–2025E</h3>
            </div>
          </div>
          <IndustryTrend data={trend} color={ind.color} />
          <div className="insight-box" style={{ borderColor: ind.color }}>
            <div className="label" style={{ color: ind.color }}>EDITORIAL</div>
            <p>5년간 합산 매출이 {((trend[4].v / trend[0].v - 1) * 100).toFixed(0)}% 성장. 산업 전체로 보면 견조하지만, 안을 들여다보면 양극화가 뚜렷하다.</p>
          </div>
        </div>
        <div className="dash-card">
          <span className="mono-eyebrow">Positioning</span>
          <h3 style={{ marginBottom: 18 }}>이익률 × 매출 산포도</h3>
          <ScatterChart items={scatter} color={ind.color} />
        </div>
      </div>

      <div className="dash-card" style={{ marginBottom: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "end", marginBottom: 18 }}>
          <div>
            <span className="mono-eyebrow">Ranking</span>
            <h3>상위 10개사 · 2025 매출 기준</h3>

        </div>
        <TopBarsChart items={top10} color={ind.color} />

      {/* ── Company list (single sortable, with inline subcat tags) ── */}

          {["revenue", "margin", "growth"].map(k => (
            <button key={k} className={sortBy === k ? "active" : ""} onClick={() => setSortBy(k)}>

            </button>
          ))}

      </div>

      {/* ── Sub-industry filter pills + inline stats panel ── */}
      {hasSubcats && (
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginBottom: 18 }}>
          <button onClick={() => setActiveSubcat(null)}
            style={{ padding: "8px 16px", borderRadius: 999, fontSize: 13, fontWeight: 600, fontFamily: "inherit",
              background: !activeSubcat ? "#111" : "#F1EFEA",
              color: !activeSubcat ? "#fff" : "#2A2A28",
              border: "none", cursor: "pointer", transition: "all 150ms" }}>
            전체 ({totalCount})
          </button>
          {subcatList.map(sc => {
            const c = subcatColors[sc] || ind.color;
            const active = activeSubcat === sc;
            const cnt = (subcatStats[sc] && subcatStats[sc].count) || 0;
            return (
              <button key={sc} onClick={() => setActiveSubcat(active ? null : sc)}
                style={{ padding: "8px 16px", borderRadius: 999, fontSize: 13, fontWeight: 600, fontFamily: "inherit",
                  background: active ? c : "#F1EFEA",
                  color: active ? "#fff" : "#2A2A28",
                  border: `2px solid ${active ? c : "transparent"}`,
                  cursor: "pointer", transition: "all 150ms" }}>
                <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: active ? "#fff" : c, marginRight: 6, verticalAlign: "middle" }} />
                {sc} ({cnt})
              </button>
            );
          })}

          {/* Inline stats — appears when a sub-cat is active */}
          {activeSubcat && subcatStats[activeSubcat] && (() => {
            const stats = subcatStats[activeSubcat];
            const c = subcatColors[activeSubcat] || ind.color;
            return (
              <div style={{
                flex: "0 0 100%",
                display: "flex",
                alignItems: "stretch",
                gap: 0,
                marginTop: 12,
                borderTop: `2px solid ${c}`,
                paddingTop: 12,
              }}>
                <div style={{ textAlign: "left", flex: 1, paddingRight: 12 }}>
                  <div style={{ fontSize: 9, color: "#9A988F", letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 2 }}>기업 수</div>
                  <div className="tnum" style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 500, lineHeight: 1.1 }}>{stats.count}</div>
                </div>
                <div style={{ textAlign: "left", flex: 1, paddingRight: 12, borderLeft: "1px solid #E5E2DA", paddingLeft: 12 }}>
                  <div style={{ fontSize: 9, color: "#9A988F", letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 2 }}>합산 매출</div>
                  <div className="tnum" style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 500, lineHeight: 1.1 }}>{fmtRev(stats.totalRev)}</div>
                </div>
                <div style={{ textAlign: "left", flex: 1, paddingRight: 12, borderLeft: "1px solid #E5E2DA", paddingLeft: 12 }}>
                  <div style={{ fontSize: 9, color: "#9A988F", letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 2 }}>합산 영업이익</div>
                  <div className="tnum" style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 500, lineHeight: 1.1, color: stats.totalProfit < 0 ? "#B5321A" : "#111" }}>{fmtProfit(stats.totalProfit)}</div>
                </div>
                <div style={{ textAlign: "left", flex: 1, borderLeft: "1px solid #E5E2DA", paddingLeft: 12 }}>
                  <div style={{ fontSize: 9, color: "#9A988F", letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 2 }}>평균 영업이익률</div>
                  <div className="tnum" style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 500, lineHeight: 1.1, color: stats.avgMargin >= 10 ? "#1A6B5A" : stats.avgMargin < 0 ? "#B5321A" : "#111" }}>{stats.avgMargin.toFixed(1)}%</div>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      <div className="co-table">
        <div className="row head">
          <span>#</span><span>기업명</span><span>매출 (2024)</span><span className="col-margin">영업이익률</span><span className="col-growth">5Y 성장률</span><span className="col-emp">직원 수</span><span></span>
        </div>
        {allSorted.map((c, i) => {
          const coData = window.TASTE_COMPANIES[c.name] || {};
          const marginValue = coData.margins?.["2025"] ?? coData.margins?.["2024"];
          const growthValue = coData.growthLabels?.["2025"] ?? coData.growthLabels?.["2024"];
          const margin = typeof marginValue === "number" ? marginValue.toFixed(1) : null;
          const growth = typeof growthValue === "number" ? growthValue.toFixed(1) : null;
          const emp = coData.employees;
          const isFeature = window.TASTE_COMPANIES[c.name];
          const sc = subcatMap[c.name];
          const scColor = sc ? (subcatColors[sc] || ind.color) : ind.color;
          return (
            <div key={c.name} className="row" onClick={() => isFeature && onView({ name: "company", id: c.name })} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>
              <span className="rank tnum">{String(i + 1).padStart(2, "0")}</span>
              <span className="name" style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                <span style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</span>
                {sc && hasSubcats && (
                  <span style={{ flexShrink: 0, fontSize: 9, padding: "2px 7px", background: scColor, color: "#fff", borderRadius: 999, letterSpacing: "0.04em", fontWeight: 600, whiteSpace: "nowrap" }}>{sc}</span>
                )}
                {window.TASTE_STOCK && window.TASTE_STOCK[c.name] && <span style={{ flexShrink: 0, fontSize: 9, padding: "2px 6px", background: "#111", color: "#fff", borderRadius: 2, letterSpacing: "0.06em" }}>상장</span>}
              </span>
              <span className="num tnum">{Object.keys(coData.revenue || {}).length ? fmtKR(c.v) : "—"}</span>
              <span className={"num tnum col-margin " + (margin !== null && parseFloat(margin) >= 10 ? "pos" : "")}>{margin === null ? "—" : margin + "%"}</span>
              <span className={"num tnum col-growth " + (growth !== null && parseFloat(growth) > 0 ? "pos" : growth !== null ? "neg" : "")}>{growth === null ? "—" : (parseFloat(growth) > 0 ? "+" : "") + growth + "%"}</span>
              <span className="num tnum col-emp" style={{ color: "#6B6B68" }}>{emp == null ? "—" : emp.toLocaleString()}</span>
              <span className="arrow">→</span>
            </div>
          );
        })}
      </div>
    </main>
  );
}

// Mini industry trend chart
function IndustryTrend({ data, color }) {
  const W = 720, H = 280;
  const pad = { l: 50, r: 30, t: 30, b: 36 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const max = Math.max(...data.map(d => d.v)) * 1.1;
  const x = i => pad.l + (i / (data.length - 1)) * iW;
  const y = v => pad.t + iH - (v / max) * iH;
  const linePath = data.map((d, i) => `${i === 0 ? "M" : "L"}${x(i)},${y(d.v)}`).join(" ");
  const areaPath = `${linePath} L${x(data.length - 1)},${pad.t + iH} L${x(0)},${pad.t + iH} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
      <defs>
        <linearGradient id={"g" + color.replace("#", "")} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75].map(t => (
        <line key={t} x1={pad.l} x2={W - pad.r} y1={pad.t + iH * t} y2={pad.t + iH * t} stroke="#E5E2DA" strokeDasharray="2 4" />
      ))}
      <line x1={pad.l} x2={W - pad.r} y1={pad.t + iH} y2={pad.t + iH} stroke="#111" />
      <path d={areaPath} fill={`url(#g${color.replace("#", "")})`} />
      <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" />
      {data.map((d, i) => (
        <g key={d.y}>
          <circle cx={x(i)} cy={y(d.v)} r="4" fill="#fff" stroke={color} strokeWidth="2" />
          <text x={x(i)} y={y(d.v) - 12} textAnchor="middle" fontFamily="Fraunces, serif" fontSize="13" fontWeight="500" fill="#111">{fmtKR(d.v)}</text>
          <text x={x(i)} y={pad.t + iH + 22} textAnchor="middle" fontSize="11" fill="#6B6B68">{d.y}{i === data.length - 1 ? "E" : ""}</text>
        </g>
      ))}
    </svg>
  );
}

// ─────────────────────── Relationship Map ────────────────────────────────
function RelationshipMap({ companyName }) {
  const svgRef = React.useRef(null);
  const [showAll, setShowAll] = React.useState(false);
  const rel = window.TASTE_RELATIONS && window.TASTE_RELATIONS[companyName];

  const hasSubs = rel && (rel.subs||[]).length > 0;
  const hasAff  = rel && (rel.affiliates||[]).length > 0;
  const hasParent = rel && !!rel.parent;
  const isStandalone = !hasSubs && !hasAff && !hasParent;

  // ── 그린 컬러 팔레트 ──
  const COL_SUBS = { fill:'#e6f4ef', hd_fill:'#d0e8df', bd:'#00704A', hd_tc:'#0a2e1e', tc:'#0a2e1e' };
  const COL_AFF  = { fill:'#f0f9f5', hd_fill:'#dff0e8', bd:'#4CAF8A', hd_tc:'#0a2e1e', tc:'#0a2e1e' };
  const COL_PAR  = { fill:'#fafdf8', bd:'#7ec8a8', tc:'#0a2e1e' };

  const getGroups = function(r) {
    var g = [];
    if ((r.subs||[]).length > 0)       g.push({ key:'subs', label:'자회사',   items:r.subs,       col:COL_SUBS });
    if ((r.affiliates||[]).length > 0) g.push({ key:'aff',  label:'관계기업', items:r.affiliates, col:COL_AFF  });
    return g;
  };

  React.useEffect(function() {
    if (!svgRef.current) return;
    if (isStandalone) { svgRef.current.innerHTML = ''; return; }

    var parent = (rel && rel.parent) || null;
    var parentRel = parent && window.TASTE_RELATIONS && window.TASTE_RELATIONS[parent];
    var grandParent = parentRel ? (parentRel.parent || null) : null;
    var groups = rel ? getGroups(rel) : [];
    if (!parent && !groups.length) { svgRef.current.innerHTML = ''; return; }

    var MAX=3, NW=164, NH=36, NW_CO=196, NH_CO=52;
    var HGAP=10, VGAP_PAR=50, VGAP_CO=58, CGAP=22;
    var nodes=[], edges=[];
    var totalGW = groups.length*NW + Math.max(0,groups.length-1)*CGAP;
    var svgW = Math.max(totalGW, NW_CO) + 80;
    var cx = svgW/2;
    var y = 16;

    if (grandParent) {
      nodes.push({ id:'gpar', type:'parent', label:grandParent, x:cx-NW/2, y:y, w:NW, h:NH, col:COL_PAR });
      edges.push({ from:'gpar', to:'par', color:'#7ec8a8', thick:2 });
      y += NH + VGAP_PAR;
    }

    if (parent) {
      nodes.push({ id:'par', type:'parent', label:parent, x:cx-NW/2, y:y, w:NW, h:NH, col:COL_PAR });
      edges.push({ from:'par', to:'co', color:'#7ec8a8', thick:2 });
      y += NH + VGAP_PAR;
    }

    nodes.push({ id:'co', type:'company', label:companyName, x:cx-NW_CO/2, y:y, w:NW_CO, h:NH_CO });
    y += NH_CO + VGAP_CO;

    if (groups.length > 0) {
      var tgW = groups.length*NW + Math.max(0,groups.length-1)*CGAP;
      var gX = cx - tgW/2;
      var maxRowItems = 0;
      groups.forEach(function(grp, gi) {
        var hid = 'h'+gi;
        var displayItems = showAll ? grp.items : grp.items.slice(0, MAX);
        nodes.push({ id:hid, type:'header', label:grp.label+' ('+grp.items.length+')', x:gX, y:y, w:NW, h:NH, col:grp.col });
        edges.push({ from:'co', to:hid, color:grp.col.bd, thick:1.8 });
        var iY = y + NH + HGAP + 10;
        displayItems.forEach(function(item, ii) {
          var nid = 'i'+gi+'_'+ii;
          nodes.push({ id:nid, type:'item', label:item, x:gX, y:iY, w:NW, h:NH, col:grp.col, full:item });
          edges.push({ from:hid, to:nid, color:grp.col.bd, thick:1.1, dash:true });
          iY += NH + HGAP;
        });
        if (displayItems.length > maxRowItems) maxRowItems = displayItems.length;
        gX += NW + CGAP;
      });
      y += NH + HGAP + 10 + maxRowItems*(NH+HGAP) + 16;
    }

    var nm = {}; nodes.forEach(function(n){ nm[n.id]=n; });
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('width',svgW); svg.setAttribute('height',y);
    svg.setAttribute('viewBox','0 0 '+svgW+' '+y);
    svg.setAttribute('style','display:block;margin:0 auto;max-width:100%');

    var defs = document.createElementNS(NS,'defs');
    var pat=document.createElementNS(NS,'pattern'); pat.id='rmDot';
    pat.setAttribute('width','22'); pat.setAttribute('height','22'); pat.setAttribute('patternUnits','userSpaceOnUse');
    var dot=document.createElementNS(NS,'circle'); dot.setAttribute('cx','1'); dot.setAttribute('cy','1'); dot.setAttribute('r','0.8'); dot.setAttribute('fill','#b0d8c4');
    pat.appendChild(dot); defs.appendChild(pat);
    svg.appendChild(defs);

    var bgR=document.createElementNS(NS,'rect');
    bgR.setAttribute('width',svgW); bgR.setAttribute('height',y); bgR.setAttribute('fill','url(#rmDot)'); bgR.setAttribute('opacity','0.2');
    svg.appendChild(bgR);

    edges.forEach(function(e){
      var fn=nm[e.from], tn=nm[e.to]; if(!fn||!tn) return;
      var x1=fn.x+(fn.w||NW)/2, y1=(fn.y||0)+(fn.h||NH);
      var x2=tn.x+(tn.w||NW)/2, y2=tn.y||0, my=(y1+y2)/2;
      var p=document.createElementNS(NS,'path');
      p.setAttribute('d','M'+x1+','+y1+' C'+x1+','+my+' '+x2+','+my+' '+x2+','+y2);
      p.setAttribute('fill','none'); p.setAttribute('stroke',e.color);
      p.setAttribute('stroke-width',e.thick||1.5); p.setAttribute('opacity',e.dash?'0.4':'0.55');
      if(e.dash) p.setAttribute('stroke-dasharray','4,3');
      svg.appendChild(p);
    });

    nodes.forEach(function(n){
      var g=document.createElementNS(NS,'g');
      var isCo=n.type==='company', isPar=n.type==='parent', isHdr=n.type==='header';
      var nw=n.w||NW, nh=n.h||NH;
      if(isCo){
        var halo=document.createElementNS(NS,'rect');
        halo.setAttribute('x',n.x-6); halo.setAttribute('y',n.y-6);
        halo.setAttribute('width',nw+12); halo.setAttribute('height',nh+12); halo.setAttribute('rx','16');
        halo.setAttribute('fill','#c2e8d4'); halo.setAttribute('stroke','#7ec8a8');
        halo.setAttribute('stroke-width','1.5'); halo.setAttribute('opacity','0.5');
        g.appendChild(halo);
        var sh=document.createElementNS(NS,'rect');
        sh.setAttribute('x',n.x); sh.setAttribute('y',n.y+3);
        sh.setAttribute('width',nw); sh.setAttribute('height',nh); sh.setAttribute('rx','12');
        sh.setAttribute('fill','rgba(0,100,60,0.08)'); g.appendChild(sh);
      } else if(isPar){
        var sh2=document.createElementNS(NS,'rect');
        sh2.setAttribute('x',n.x); sh2.setAttribute('y',n.y+2);
        sh2.setAttribute('width',nw); sh2.setAttribute('height',nh); sh2.setAttribute('rx','8');
        sh2.setAttribute('fill','rgba(0,112,74,0.06)'); g.appendChild(sh2);
      }
      var rect=document.createElementNS(NS,'rect');
      rect.setAttribute('x',n.x); rect.setAttribute('y',n.y);
      rect.setAttribute('width',nw); rect.setAttribute('height',nh);
      rect.setAttribute('rx',isCo?'12':isHdr?'8':'7');
      if(isCo){ rect.setAttribute('fill','#00704A'); }
      else if(isPar){ rect.setAttribute('fill',n.col.fill); rect.setAttribute('stroke',n.col.bd); rect.setAttribute('stroke-width','1.5'); }
      else if(isHdr){ rect.setAttribute('fill',n.col.hd_fill); rect.setAttribute('stroke',n.col.bd); rect.setAttribute('stroke-width','1.5'); }
      else{ rect.setAttribute('fill',n.col.fill); rect.setAttribute('stroke',n.col.bd); rect.setAttribute('stroke-width','1'); rect.setAttribute('stroke-opacity','0.5'); }
      g.appendChild(rect);
      var raw=n.label||'', maxCh=isCo?20:isHdr?15:14;
      var disp=raw.length>maxCh?raw.substring(0,maxCh-1)+'…':raw;
      var txt=document.createElementNS(NS,'text');
      txt.setAttribute('x',n.x+nw/2); txt.setAttribute('y',n.y+nh/2+1);
      txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','middle');
      txt.setAttribute('font-family',"'Noto Sans KR',sans-serif");
      txt.setAttribute('font-size',isCo?'14':isHdr?'12':'11');
      txt.setAttribute('font-weight',isCo?'700':isHdr?'600':'500');
      txt.setAttribute('fill',isCo?'#fff':isPar?n.col.tc:isHdr?n.col.hd_tc:n.col.tc);
      txt.textContent=disp; g.appendChild(txt);
      if(raw!==disp){ var title=document.createElementNS(NS,'title'); title.textContent=raw; g.appendChild(title); }
      svg.appendChild(g);
    });

    svgRef.current.innerHTML = '';
    svgRef.current.appendChild(svg);
  }, [showAll, rel, isStandalone]);

  var hasMore = !isStandalone && rel && getGroups(rel).some(function(g){ return g.items.length > 3; });

  return (
    <div className="chart-card" style={{ marginTop: 24 }}>
      <div className="head">
        <div className="left">
          <span className="eyebrow">Section 06 · Corporate Structure</span>
          <h3>계열사 · 관계사 구조</h3>

        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {hasParent && (

              모회사 있음

          {hasSubs && (

            </span>
          )}
        </div>
      </div>

      {isStandalone ? (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'20px 0 12px' }}>
          {(function(){
            var NS2='http://www.w3.org/2000/svg', svgW=280, NH_CO=52, NW_CO=196;
            var cx=svgW/2, x=cx-NW_CO/2, y=14;
            return React.createElement('svg', { width:svgW, height:80, viewBox:'0 0 '+svgW+' 80', style:{display:'block',margin:'0 auto'} },
              React.createElement('rect', { x:x-5, y:y-5, width:NW_CO+10, height:NH_CO+10, rx:16, fill:'#c2e8d4', stroke:'#7ec8a8', strokeWidth:1, opacity:0.5 }),

              React.createElement('rect', { x:x, y:y, width:NW_CO, height:NH_CO, rx:12, fill:'#00704A' }),
              React.createElement('text', { x:cx, y:y+NH_CO/2+1, textAnchor:'middle', dominantBaseline:'middle', fontFamily:"'Noto Sans KR',sans-serif", fontSize:15, fontWeight:700, fill:'#fff' }, companyName)
            );
          })()}
          <p style={{ fontSize:12, color:'#9A988F', marginTop:12 }}>공시된 종속기업 및 관계기업이 없는 독립 법인입니다.</p>

// ─────────────────────── Company View (PRIORITY) ───────────────────────
function CompanyView({ companyId, onView }) {
  const co = window.TASTE_COMPANIES[companyId] || window.TASTE_COMPANIES[window.TASTE_DEFAULT_COMPANY];
  if (co?.__apiPublicId) return <ApiCompanyDetailView companyId={co.__apiPublicId} onView={onView} />;
  const ind = window.TASTE_INDUSTRIES.find(i => i.id === co.industry);

  const lastYear = co.revenue?.["2025"] ? "2025" : "2024";
  const prevYear = String(Number(lastYear) - 1);
  const lastRev = co.revenue[lastYear] || 0;
  const prevRev = co.revenue[prevYear] || 0;
  const revGrowth = prevRev ? ((lastRev - prevRev) / prevRev) * 100 : 0;
  const lastMargin = co.margins[lastYear] || 0;
  const prevMargin = co.margins[prevYear] || 0;
  const marginDelta = lastMargin - prevMargin;

  // Stock — pick parent if listed
  const stockKey = window.TASTE_STOCK[co.name] ? co.name : null;
  const stock = stockKey ? window.TASTE_STOCK[stockKey] : null;
  const stockReturn = stock ? ((stock[stock.length - 1].p - stock[0].p) / stock[0].p) * 100 : null;

  return (
    <main className="page">
      {/* Breadcrumb */}
      <div className="co-breadcrumb">
        <span className="crumb" onClick={() => onView({ name: "home" })} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>홈</span>
        <span className="sep">/</span>
        <span className="crumb" onClick={() => onView({ name: "industry", id: co.industry })} role="button" tabIndex={0} onKeyDown={(e)=>{if(e.key==="Enter"||e.key===" ")e.currentTarget.click();}}>{co.industryName}</span>
        <span className="sep">/</span>
        <span style={{ color: ind.color, fontWeight: 600 }}>{co.name}</span>
      </div>

      {/* Hero */}
      <section className="co-hero" style={{ "--c": ind.color }}>
        <div className="co-meta">
          <span className="co-tag solid" style={{ "--c": ind.color }}>{co.industryName}</span>
          <span className={"co-tag " + (co.listed ? "listed" : "unlisted")}>{co.listed ? "● 상장" : "○ 비상장"}</span>
          {co.parent && <span className="co-tag">모기업 · {co.parent}</span>}
        </div>
        <h1 className="co-name">{co.name}</h1>
        <p className="co-desc">{co.description}</p>
        <div className="co-info-row">
          <div className="item"><span className="l">법인명</span><span className="v">{co.legalName}</span></div>
          <div className="item"><span className="l">설립</span><span className="v">{co.founded}년</span></div>
          <div className="item"><span className="l">본사</span><span className="v">{co.location}</span></div>
          <div className="item"><span className="l">직원 수</span><span className="v tnum">{co.employees.toLocaleString()}명</span></div>
          {co.avgSalary && (
            <div className="item"><span className="l">평균 연봉</span><span className="v tnum">{co.avgSalary.toLocaleString()}만원</span></div>
          )}
          <div className="item"><span className="l">출처</span><span className="v">{co.revenue && co.revenue['2025'] ? 'DART · 2025 사업보고서' : 'DART · 2024 사업보고서'}</span></div>
        </div>
      </section>

      {/* KPI 4-up */}
      <section className="kpi-grid">
        <div className="kpi">
          <div className="lbl">{lastYear} 매출</div>
          <div className="val tnum">{lastRev >= 10000 ? (lastRev / 10000).toFixed(1) : lastRev.toLocaleString()}<span className="u">{lastRev >= 10000 ? "조" : "억"}</span></div>
          <div className={"delta " + (revGrowth > 0 ? "pos" : "neg")}>
            <span className="arrow">{revGrowth > 0 ? "▲" : "▼"}</span>
            전년 대비 {revGrowth > 0 ? "+" : ""}{revGrowth.toFixed(1)}%
          </div>
        </div>
        <div className="kpi">
          <div className="lbl">영업이익률</div>
          <div className="val tnum">{lastMargin.toFixed(1)}<span className="u">%</span></div>
          <div className={"delta " + (marginDelta > 0 ? "pos" : "neg")}>
            <span className="arrow">{marginDelta > 0 ? "▲" : "▼"}</span>
            전년 대비 {marginDelta > 0 ? "+" : ""}{marginDelta.toFixed(1)}p
          </div>
        </div>
        <div className="kpi">
          <div className="lbl">3년 주가 수익률</div>
          {stock ? (
            <>
              <div className="val tnum" style={{ color: stockReturn > 0 ? "#1A6B5A" : "#B5321A" }}>
                {stockReturn > 0 ? "+" : ""}{stockReturn.toFixed(1)}<span className="u">%</span>
              </div>
              <div className="delta" style={{ color: "#6B6B68" }}>모기업 {stockKey} 기준</div>

        <div className="kpi">
          <div className="lbl">1인당 매출</div>

          <div className="delta" style={{ color: "#6B6B68" }}>직원 {co.employees.toLocaleString()}명 기준</div>
        </div>
        {co.profitPerEmployee != null && co.profitPerEmployee >= 1 && (

              {co.profitPerEmployee >= 0 ? "" : "−"}{Math.abs(co.profitPerEmployee).toFixed(1)}<span className="u">억</span>
            </div>
            <div className="delta" style={{ color: "#6B6B68" }}>직원 {co.employees.toLocaleString()}명 기준</div>
          </div>
        )}

      </section>

      {/* Revenue + Margin chart */}
      <div className="chart-card">
        <div className="head">
          <div className="left">
            <span className="eyebrow">Section 02 · Revenue & Profitability</span>
            <h3>매출 × 영업이익률 — 5년 흐름</h3>
          </div>
          <div className="legend">
            <div className="item"><div className="sw" style={{ background: ind.color }} />매출 (억원)</div>
            <div className="item"><div className="sw" style={{ background: "#1A6B5A" }} />영업이익률 (%)</div>
          </div>
        </div>
        <div className="rev-chart-grid">
          <RevenueProfitChart data={co} color={ind.color} />
          <RevenueTable data={co} color={ind.color} />
        </div>
        <div className="insight-box" style={{ borderColor: ind.color }}>
          <div className="label" style={{ color: ind.color }}>EDITORIAL TAKE</div>
          <p>{co.insight}</p>
        </div>
      </div>

      {/* Stock Performance - full width */}
      <div className="chart-card">
        <div className="head">
          <div className="left">
            <span className="eyebrow">Section 03 · Stock Performance</span>

          </div>

            ? <div style={{ fontSize: 12, color: "#6B6B68" }}>{`모기업 ${stockKey} 기준`}</div>
            : <div style={{ fontSize: 11, fontWeight: 700, color: "#2A2A28", background: "#E5E2DA", padding: "3px 10px", borderRadius: 20, letterSpacing: "0.04em" }}>비상장</div>
          }

                ["3Y 수익률", `${stockReturn.toFixed(1)}%`, "ret"],
                ["최고가", stock.reduce((m, d) => Math.max(m, d.p), 0).toLocaleString(), "plain"],
                ["최저가", stock.reduce((m, d) => Math.min(m, d.p), Infinity).toLocaleString(), "plain"],

              return (
                <div style={{ display: "flex", flexWrap: "wrap", gap: "16px 0", marginTop: 24, borderTop: "1px solid #E5E2DA", paddingTop: 18 }}>
                  {metrics.map(([l, v, type]) => (
                    <div key={l} style={{ flex: "1 1 20%", minWidth: 80, paddingRight: 8 }}>
                      <div style={{ fontSize: 10, color: "#9A988F", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 5, whiteSpace: "nowrap" }}>{l}</div>
                      <div className="tnum" style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 500,
                        color: type === "ret" && parseFloat(v) > 0 ? "#1A6B5A" : type === "ret" ? "#B5321A" : type === "per" && perVal != null ? "#2A2A28" : "#111" }}>
                        {type === "ret" && parseFloat(v) > 0 ? "+" : ""}{v}
                      </div>
                    </div>
                  ))}

              );
            })()}
            <div className="insight-box">
              <div className="label">VS BENCHMARK</div>
              <p>같은 기간 매출은 {((lastRev / co.revenue["2021"] - 1) * 100).toFixed(0)}% 성장했지만, 주가는 {stockReturn.toFixed(0)}% — 시장은 실적보다 더 큰 기대를 반영하고 있다.</p>

        <div className="head">
          <div className="left">
            <span className="eyebrow">Section 07 · Editorial Take</span>
            <h3>이 기업, 한 줄로 정의하면</h3>

      {/* Book ref */}
      <div style={{ marginTop: 32, background: "#fff", border: "1px solid #E5E2DA", padding: "26px 32px", display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 24, alignItems: "center" }}>
        <div style={{ width: 60, height: 80, background: ind.color, color: "#fff", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", fontFamily: "Fraunces, serif", fontSize: 11, lineHeight: 1.2, padding: 6, textAlign: "center" }}>

          <div style={{ fontSize: 13, color: "#6B6B68" }}>2026년 10월 출간 · 사전예약 알림 받기</div>

// ─────────────────────── Company Scatter Chart ───────────────────────
function CompanyScatterChart({ companies, onView, highlightIndustry }) {
  // ── hooks 최상단 ──
  const [tooltip, setTooltip] = React.useState(null);

  const W = 1280, H = 620;
  const pad = { l: 72, r: 40, t: 50, b: 72 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;

  // Filter out extreme values
  const valid = companies.filter(c => {
    const r = c.revenue["2024"] || 0;
    const m = c.margins["2024"];
    return r > 0 && m !== undefined && m > -60 && m < 90;
  });

  const revenues = valid.map(c => c.revenue["2024"]);
  const logMin = Math.log10(Math.max(1, Math.min(...revenues)));
  const logMax = Math.log10(Math.max(...revenues)) + 0.05;
  const margins = valid.map(c => c.margins["2024"]);
  const yMin = Math.min(-25, Math.min(...margins) - 3);
  const yMax = Math.max(80, Math.max(...margins) + 5);

  const sx = v => pad.l + ((Math.log10(Math.max(1, v)) - logMin) / (logMax - logMin)) * iW;
  const sy = v => pad.t + iH - ((v - yMin) / (yMax - yMin)) * iH;
  const sz = v => Math.max(4, Math.min(22, Math.log10(Math.max(1, v)) * 2.2));

  // X axis ticks (log scale)
  const xTicks = [100, 300, 500, 1000, 3000, 5000, 10000, 30000, 50000, 100000, 300000, 500000, 1000000];
  const yTicks = [-20, -10, 0, 10, 20, 30, 40, 50, 60, 70, 80];

  // IND_COLORS — labelPlacements 전에 정의
  const IND_COLORS = {};
  window.TASTE_INDUSTRIES.forEach(i => { IND_COLORS[i.id] = i.color; });

  // Labels: 우선순위 기반 선정 + 충돌 방지
  const notableSet = new Set();
  [...valid].sort((a,b) => (b.margins["2025"]||b.margins["2024"]||0) - (a.margins["2025"]||a.margins["2024"]||0)).slice(0,8).forEach(c => notableSet.add(c.name));
  [...valid].sort((a,b) => (b.revenue["2025"]||b.revenue["2024"]||0) - (a.revenue["2025"]||a.revenue["2024"]||0)).slice(0,8).forEach(c => notableSet.add(c.name));

  // 충돌 방지 라벨 배치 계산
  const CHAR_W = 8.5, FONT_H = 17;
  const placedBoxes = [];
  function tryBbox(cx, cy, rad, nameLen, pos) {
    const w = nameLen * CHAR_W;
    let tx, ty;
    if (pos === "right")  { tx = cx + rad + 4; ty = cy + 5; }
    else if (pos === "left")  { tx = cx - rad - 4 - w; ty = cy + 5; }
    else if (pos === "top")   { tx = cx - w/2; ty = cy - rad - 5; }
    else                      { tx = cx - w/2; ty = cy + rad + FONT_H + 3; }
    return { x1: tx-2, y1: ty-FONT_H, x2: tx+w+2, y2: ty+5, tx, ty };
  }
  function hasCollision(box) {
    return placedBoxes.some(p =>
      box.x2+3 > p.x1 && box.x1-3 < p.x2 && box.y2+3 > p.y1 && box.y1-3 < p.y2
    );
  }
  // 중요도 순 정렬: 마진 높은 것 > 매출 큰 것
  const notablePriority = [...notableSet].map(name => {
    const c = valid.find(co => co.name === name);
    if (!c) return null;
    return { name, rev: c.revenue["2025"]||c.revenue["2024"]||0, margin: c.margins["2025"]||c.margins["2024"]||0, industry: c.industry };
  }).filter(Boolean).sort((a,b) =>
    (Math.abs(b.margin) + Math.log10(b.rev||1)*2) - (Math.abs(a.margin) + Math.log10(a.rev||1)*2)
  );

  const labelPlacements = [];
  notablePriority.forEach(({ name, rev, margin, industry }) => {
    const cx = sx(rev), cy = sy(margin), rad = sz(rev);
    const nameLen = name.length;
    for (const pos of ["right","left","top","bottom"]) {
      const box = tryBbox(cx, cy, rad, nameLen, pos);
      // 차트 경계 체크
      if (box.x1 < pad.l || box.x2 > W - pad.r + 10 || box.y1 < pad.t - 5 || box.y2 > pad.t + iH + 5) continue;
      if (!hasCollision(box)) {
        placedBoxes.push(box);
        labelPlacements.push({ name, cx, cy, rad, tx: box.tx, ty: box.ty, color: IND_COLORS[industry] || "#999" });
        break;
      }
    }
  });

  // Median revenue for vertical split
  const sortedRevs = [...revenues].sort((a,b) => a-b);
  const medianRev = sortedRevs[Math.floor(sortedRevs.length/2)];

        {/* Zero margin line */}

        {/* X gridlines + labels */}
        {xTicks.map(t => {
